// Payments: the one number the rest of the app's "real" figures depend on.
// A pending row can be marked paid or nudged with a reminder; nothing here is
// ever visible to the patient — except the hosted Stripe checkout link itself,
// which is the one thing that IS meant to reach them.
const PAYMENT_TYPES = ["deposit","balance","full"];
const PAYMENT_CURRENCIES = ["EUR","USD","GBP","TRY"];
function Payments({ leadId, payments, onChanged }){
  const [amount,setAmount] = useState("");
  const [currency,setCurrency] = useState("EUR");
  const [type,setType] = useState("deposit");
  const [dueDate,setDueDate] = useState("");
  const [busy,setBusy] = useState(false);
  const [linkBusy,setLinkBusy] = useState(false);

  const add = async ()=>{
    const amt = Number(amount);
    if(!amt || amt<=0) return;
    setBusy(true);
    try{
      await api("/conversations/"+leadId+"/payments", { method:"POST", body: JSON.stringify({ amount: amt, currency, type, dueDate: dueDate||null }) });
      setAmount(""); setDueDate(""); showToast(T("toast.paymentAdded")); await onChanged();
    }catch(e){ showToast(e.message,"error"); }
    finally{ setBusy(false); }
  };
  // One click: creates the payment row, generates a checkout link (Stripe or
  // İyzico, picked by currency — see `provider` below) in the chosen
  // currency, and sends it straight to the patient's own channel
  // (WhatsApp/Instagram/Messenger) — no IBAN, no manual follow-up.
  const createLink = async ()=>{
    const amt = Number(amount);
    if(!amt || amt<=0) return;
    setLinkBusy(true);
    try{
      await api("/conversations/"+leadId+"/payments/link", { method:"POST", body: JSON.stringify({ amount: amt, currency, type, dueDate: dueDate||null }) });
      setAmount(""); setDueDate(""); showToast(T("toast.paymentLinkSent")); await onChanged();
    }catch(e){ showToast(e.message,"error"); }
    finally{ setLinkBusy(false); }
  };
  const markPaid = async (id)=>{
    try{ await api("/payments/"+id, { method:"PUT", body: JSON.stringify({ status:"paid" }) }); showToast(T("toast.paymentPaid")); await onChanged(); }
    catch(e){ showToast(e.message,"error"); }
  };
  const remind = async (id)=>{
    try{ await api("/payments/"+id, { method:"PUT", body: JSON.stringify({ reminder:true }) }); showToast(T("toast.reminderSet")); await onChanged(); }
    catch(e){ showToast(e.message,"error"); }
  };
  const copyLink = async (url)=>{
    try{ await navigator.clipboard.writeText(url); showToast(T("payments.copied")); }catch{}
  };
  // Mirrors the server's defaultProviderFor(): TRY → İyzico (the gateway a
  // Turkish clinic entity can actually hold an account with), everything
  // else → Stripe. Shown on the button so the coordinator isn't surprised by
  // which one fires.
  const provider = currency==="TRY" ? "iyzico" : "stripe";

  return html`<div class="notes">
    <div class="section-title" style=${{marginTop:"20px",marginBottom:"10px",fontSize:"13px"}}>${T("payments.title")}</div>
    <div style=${{display:"flex",gap:"6px"}}>
      <input type="number" min="0" step="0.01" placeholder=${T("payments.amount")} value=${amount}
        onInput=${(e)=>setAmount(e.target.value)} style=${{flex:"1",minWidth:"0"}}/>
      <select aria-label=${T("common.currency")} value=${currency} onChange=${(e)=>setCurrency(e.target.value)} style=${{flex:"none"}}>
        ${PAYMENT_CURRENCIES.map((c)=> html`<option key=${c} value=${c}>${c}</option>`)}
      </select>
      <select aria-label=${T("payments.typeLabel")} value=${type} onChange=${(e)=>setType(e.target.value)} style=${{flex:"none"}}>
        ${PAYMENT_TYPES.map((t)=> html`<option key=${t} value=${t}>${T("payments.type."+t)}</option>`)}
      </select>
    </div>
    <input type="date" value=${dueDate} onInput=${(e)=>setDueDate(e.target.value)}
      style=${{width:"100%",marginTop:"6px"}} title=${T("payments.due")}/>
    <button class="btn primary" style=${{marginTop:"8px",width:"100%"}} disabled=${linkBusy||busy||!amount} onClick=${createLink}>${T("payments.createLink")} · ${T("payments.provider."+provider)}</button>
    <button class="btn" style=${{marginTop:"6px",width:"100%"}} disabled=${busy||linkBusy||!amount} onClick=${add}>${T("payments.add")}</button>
    ${(payments||[]).length===0
      ? html`<div class="note-empty">${T("payments.empty")}</div>`
      : (payments||[]).map((pmt)=> html`<div class="note" key=${pmt.id}>
          <div class="note-meta">
            ${T("payments.type."+pmt.type)} · ${pmt.currency} ${Number(pmt.amount).toLocaleString()}
            · <span class="badge ${pmt.status==='paid'?'human':pmt.status==='pending'?'awaiting':''}">${T("payments.status."+pmt.status)}</span>
            ${pmt.due_date? html` · ${T("payments.due")}: ${pmt.due_date}`:null}
            ${pmt.provider? html` · <span class="badge">${T("payments.provider."+pmt.provider)||pmt.provider}</span>`:null}
          </div>
          ${pmt.status==="pending"? html`<div style=${{display:"flex",gap:"6px",marginTop:"6px",flexWrap:"wrap"}}>
            <button class="btn" style=${{fontSize:"11px",padding:"4px 8px"}} onClick=${()=>markPaid(pmt.id)}>${T("payments.markPaid")}</button>
            <button class="btn" style=${{fontSize:"11px",padding:"4px 8px"}} disabled=${!!pmt.reminder_sent_at} onClick=${()=>remind(pmt.id)}>
              ${pmt.reminder_sent_at? T("payments.reminded")+" · "+fmtTime(pmt.reminder_sent_at) : T("payments.remind")}
            </button>
            ${pmt.checkout_url? html`<button class="btn" style=${{fontSize:"11px",padding:"4px 8px"}} onClick=${()=>copyLink(pmt.checkout_url)}>${T("payments.copyLink")}</button>`:null}
          </div>`:null}
          ${pmt.link_sent_at? html`<div class="note-meta" style=${{marginTop:"4px",fontSize:"11px"}}>${T("payments.linkSent")} · ${fmtTime(pmt.link_sent_at)}</div>`:null}
        </div>`)}
  </div>`;
}

// Quotes: the concierge already knows the treatment, so the coordinator
// starts from a suggested draft instead of a blank page, edits the line
// items (never the total — that's always recomputed server-side, see
// updateQuote()), and sends. One card per quote, at most one open for
// editing at a time — this column is 290px wide, not a spreadsheet.
const QUOTE_LANGS = ["en","tr","de","ar","ru","fr"];
function Quotes({ leadId, quotes, onChanged }){
  const [busy,setBusy] = useState(false);
  const [openId,setOpenId] = useState(null);

  const suggest = async ()=>{
    setBusy(true);
    try{
      const q = await api("/conversations/"+leadId+"/quotes/draft", { method:"POST" });
      showToast(T("toast.quoteDrafted")); setOpenId(q.id); await onChanged();
    }catch(e){ showToast(e.message,"error"); }
    finally{ setBusy(false); }
  };

  return html`<div class="notes">
    <div class="section-title" style=${{marginTop:"20px",marginBottom:"10px",fontSize:"13px"}}>${T("quotes.title")}</div>
    <button class="btn" style=${{width:"100%"}} disabled=${busy} onClick=${suggest}>${T("quotes.suggest")}</button>
    ${(quotes||[]).length===0
      ? html`<div class="note-empty">${T("quotes.empty")}</div>`
      : (quotes||[]).map((q)=> html`<${QuoteCard} key=${q.id} quote=${q}
          open=${openId===q.id} onToggle=${()=>setOpenId(openId===q.id?null:q.id)} onChanged=${onChanged} />`)}
  </div>`;
}

function QuoteCard({ quote, open, onToggle, onChanged }){
  const [busy,setBusy] = useState(false);
  const [label,setLabel] = useState("");
  const [qty,setQty] = useState("1");
  const [price,setPrice] = useState("");

  const save = async (items)=>{
    setBusy(true);
    try{ await api("/quotes/"+quote.id, { method:"PUT", body: JSON.stringify({ items }) }); showToast(T("toast.quoteUpdated")); await onChanged(); }
    catch(e){ showToast(e.message,"error"); }
    finally{ setBusy(false); }
  };
  const addItem = async ()=>{
    if(!label.trim() || !price) return;
    await save([...(quote.items||[]), { label: label.trim(), qty: Number(qty)||1, unit_price: Number(price)||0 }]);
    setLabel(""); setQty("1"); setPrice("");
  };
  const removeItem = (i)=> save((quote.items||[]).filter((_,j)=>j!==i));
  const setLang = async (language)=>{ try{ await api("/quotes/"+quote.id,{method:"PUT",body:JSON.stringify({language})}); await onChanged(); }catch(e){ showToast(e.message,"error"); } };
  const send = async ()=>{
    if(!window.confirm(T("quotes.confirmSend"))) return;
    setBusy(true);
    try{ await api("/quotes/"+quote.id+"/send", { method:"POST" }); showToast(T("toast.quoteSent")); await onChanged(); }
    catch(e){ showToast(e.message,"error"); }
    finally{ setBusy(false); }
  };
  const accept = async ()=>{
    try{ await api("/quotes/"+quote.id+"/accept", { method:"POST" }); showToast(T("toast.quoteAccepted")); await onChanged(); }
    catch(e){ showToast(e.message,"error"); }
  };
  const removeQuote = async ()=>{
    if(!window.confirm(T("quotes.confirmDelete"))) return;
    setBusy(true);
    try{ await api("/quotes/"+quote.id, { method:"DELETE" }); showToast(T("admin.deleted")); await onChanged(); }
    catch(e){ showToast(e.message,"error"); } finally{ setBusy(false); }
  };

  const isDraft = quote.status === "draft";
  return html`<div class="note">

             than fetched-then-window.open'd like the panel's other downloads.
             The PDF is rendered by headless Chromium and can take seconds on a

          : quote.status!=="accepted"? html`<button class="btn" style=${{fontSize:"11px",padding:"4px 8px"}} onClick=${accept}>${T("quotes.accept")}</button>`:null}
      </div>
    </div>`:null}
  </div>`;
}

function MiniBarChart({ data }){
  // Room reserved in the viewBox for the value labels on the left and the day
  // numbers underneath, so nothing is clipped at the drawing's edge.
  const w=680, h=142, padX=28, padTop=14, padBottom=24;
  const plot = h - padTop - padBottom;
  const max = Math.max(1, ...data.map(d=>d.count));
  const bw = (w-padX*2)/data.length;
  const base = padTop + plot;
  const y = (v)=> base - (v/max)*plot;
  // Reference lines name values the chart actually reaches — the peak and,
  // when there is room between them, its midpoint.
  const mid = Math.round(max/2);
  const ticks = max > 1 && mid > 0 && mid < max ? [max, mid] : [max];
  // The tallest day gets the brass — but only when there is something to be
  // tallest *than*. With a single active day the highlight has no comparison to
  // make and just turns the whole chart into one loud block, so it stays off.
  let peak = -1;
  if (data.filter((d)=>d.count > 0).length > 1) {
    peak = 0;
    data.forEach((d,i)=>{ if(d.count > data[peak].count) peak = i; });
  }
  return html`<svg viewBox="0 0 ${w} ${h}" style=${{width:"100%",height:"auto",display:"block"}} role="img"
                   aria-label=${`${data.reduce((a,d)=>a+d.count,0)} ${T("chart.leads")}`}>
    ${ticks.map((v,i)=> html`<g key=${"t"+i}>
      <line class="chart-grid" x1=${padX} y1=${y(v)} x2=${w-padX} y2=${y(v)}/>
      <text class="chart-label" x=${padX-7} y=${y(v)+3} textAnchor="end">${v}</text>
    </g>`)}
    <line class="chart-axis" x1=${padX} y1=${base} x2=${w-padX} y2=${base}/>
    ${data.map((d,i)=>{
      const bh = (d.count/max)*plot;
      const x = padX + i*bw;
      // Empty days keep a 1px stub on the baseline so the series reads as a
      // continuous fourteen days rather than a few floating bars.
      const drawn = Math.max(bh, 1);
      const cls = d.count ? (i===peak ? "chart-bar peak" : "chart-bar") : "chart-bar zero";
      return html`<g key=${i}>
        <rect class=${cls} x=${x+2} y=${base-drawn} width=${Math.max(1,bw-5)} height=${drawn}>
          <title>${d.count} ${T("chart.leads")}</title></rect>
        <text class="chart-label" x=${x+bw/2} y=${h-8} textAnchor="middle">${Number(d.day.slice(8,10))}</text>
      </g>`;
    })}
  </svg>`;
}

// tablo yanlış olur, o yüzden burada da adı geçiyor.

// ── Klinik Risk & Uyum Skoru ────────────────────────────────────────────────
// Ekranın tek tasarım kuralı: ölçülmüş sayı ile ölçülmemiş sayı asla aynı
// görünmez. Veri yoksa büyük bir rakam değil, "—" ve neden ölçülemediği yazar.
// 92/100 gösterip altına "kapsam %18" yazmayan bir uyum ekranı, klinik sahibini
// denetime hazır sanarak gönderir.
const COMP_ST = {
  ok:       { cls:"human",    key:"comp.st.ok" },
  warn:     { cls:"awaiting", key:"comp.st.warn" },
  fail:     { cls:"hot",      key:"comp.st.fail" },
  unknown:  { cls:"",         key:"comp.st.unknown" },
  measured: { cls:"",         key:"comp.st.measured" },
};
const COMP_KINDS = ["health_tourism_authorization","accreditation","complication_insurance","kvkk_registry","foreign_language_staff"];
const COMP_DOC_STATUSES = ["missing","in_progress","valid","expired"];

// T() yer tutucu desteklemiyor; {n} burada doldurulur, yoksa ekranda
// harfi harfine "{n}" yazar.
const compThinHint=()=> T("comp.thinHint").replace("{n}", COMP_MIN_CLINICAL);

function compValue(item){
  if(item.value==null) return "–";
  if(item.unit==="rate"||item.unit==="score") return "%"+(Math.round(item.value*1000)/10);
  if(item.unit==="minutes") return item.value<1 ? "<1 dk" : Math.round(item.value*10)/10+" dk";
  if(item.unit==="seconds") return (Math.round(item.value*10)/10)+" sn";
  return String(item.value);
}

function ComplianceItem({ item }){
  const st = COMP_ST[item.status] || COMP_ST.unknown;
  // Puanlanmayan maddeler (ağırlık 0) kasten gri kalır: bunlar not değil,
  // ölçüm. Renk vermek onları başarı/başarısızlık gibi okuturdu.
  const graded = item.weight > 0 && item.score != null;
  return html`<div class="glass" style="padding:13px 16px;display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
      <span style="font-weight:600;font-size:13.5px">${item.label}</span>
      <span class="badge ${st.cls}">${T(st.key)}</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:10px">
      ${/* Belge maddelerinin ölçüm birimi yoktur; onlara büyük puntoda "–"
            basmak, ölçülüp boş çıkmış gibi okunuyordu. Sayı alanı yalnızca
            gerçekten bir ölçüm olan maddelerde var. */ null}
      ${item.unit? html`<span style="font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:${item.value==null?"var(--ink-3)":"var(--ink)"}">
        ${compValue(item)}
      </span>`:null}
      ${graded? html`<span style="font-size:11.5px;color:var(--ink-3);font-family:var(--mono)">${Math.round(item.score*100)}/100 · ×${item.weight}</span>`
        : item.weight===0? html`<span style="font-size:11.5px;color:var(--ink-3)">${T("comp.notGraded")}</span>`:null}
      ${item.deadline_days!=null? html`<span class="badge ${item.deadline_days<=90?"hot":""}" style="margin-left:auto">
        ${item.deadline_days<0 ? T("comp.overdue") : item.deadline_days+" "+T("comp.daysLeft")}
      </span>`
       : item.in_force_since? html`<span class="badge ${item.status==="ok"?"":"hot"}" style="margin-left:auto"
           title=${T("comp.inForceHint")}>${T("comp.inForce")}</span>`:null}
    </div>
    <div style="font-size:12px;color:var(--ink-2);line-height:1.5">${item.evidence}</div>
    ${item.declared && !item.verified? html`<div style="font-size:11.5px;color:var(--brass)">${T("comp.declaredOnly")}</div>`:null}
  </div>`;
}

function DocRow({ rec, kind, onSave, busy }){
  const [status,setStatus]=useState(rec? rec.status : "missing");
  const [issuer,setIssuer]=useState(rec&&rec.issuer? rec.issuer : "");
  const [reference,setReference]=useState(rec&&rec.reference? rec.reference : "");
  const [validUntil,setValidUntil]=useState(rec&&rec.valid_until? String(rec.valid_until).slice(0,10) : "");
  const dirty = status!==(rec?rec.status:"missing")
    || issuer!==((rec&&rec.issuer)||"") || reference!==((rec&&rec.reference)||"")
    || validUntil!==((rec&&rec.valid_until)? String(rec.valid_until).slice(0,10):"");
  return html`<div class="rowgrid" style="display:grid;grid-template-columns:1.5fr .9fr 1.1fr .9fr .8fr .6fr;gap:8px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--rule)">

    <input value=${reference} placeholder=${T("comp.reference")} onInput=${(e)=>setReference(e.target.value)} style="font-size:12.5px"/>
    <input type="date" value=${validUntil} onInput=${(e)=>setValidUntil(e.target.value)} style="font-size:12.5px"/>
    <button class="btn" disabled=${!dirty||busy} onClick=${()=>onSave(kind,{status,issuer,reference,valid_until:validUntil||null})}>

}

// ── Rakip Cevap Süresi Araştırması ──────────────────────────────────────────
//
// Bu ekran ürün verisi göstermiyor: kurucunun kliniklere kendi attığı
// mesajların kaydı. Sektörde yayınlanmış bir "ortalama cevap süresi" yok;
// burada üretiliyor ve kendi ölçümümüzün yanına konuyor.
//
// Grafik tek seri ve SIRALI (zaman kovaları), o yüzden tek hue'nun açıktan
// koyuya giden tonları kullanılıyor — kategorik palet değil. "Hiç cevap yok"
// bir zaman aralığı değil, bir durum; o yüzden ayrı (uyarı) rengi hak ediyor.
const BM_CHANNELS = ["whatsapp","instagram","web_form","phone","email"];

const fmtDur = (min)=>{
  if(min==null) return "–";
  if(min < 1) return "<1 dk";
  if(min < 60) return Math.round(min)+" dk";
  const h = Math.floor(min/60), m = Math.round(min%60);
  if(h < 24) return m? `${h} sa ${m} dk` : `${h} sa`;
  return `${Math.floor(h/24)} gün ${h%24} sa`;
};
const fmtSec = (s)=> s==null? "–" : (s < 90 ? `${Math.round(s*10)/10} sn` : fmtDur(s/60));
// datetime-local <-> ISO. Tarayıcı yerel saat veriyor; sunucuya ISO gidiyor.
const toLocalInput = (d)=>{
  const t = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return t.toISOString().slice(0,16);
};

function BenchmarkChart({ buckets, settled }){
  const max = Math.max(1, ...buckets.map(b=>b.n));
  return html`<div class="glass" style="padding:18px 20px">
    <div style="font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">
      ${T("bm.chartTitle")}
    </div>
    <div class="sub" style="margin:0 0 14px;font-size:12.5px">${T("bm.chartSub")} · n=${settled}</div>
    <div style="display:flex;flex-direction:column;gap:9px">
      ${buckets.map((b,i)=>{
        const none = b.key==="none";
        // Sıralı tonlama: kova uzadıkça koyulaşır. "Hiç cevap yok" sıralı
        // ölçeğin parçası değil, ayrı durum rengi.
        const alpha = 0.42 + (i/(buckets.length-2||1))*0.58;
        return html`<div key=${b.key} style="display:grid;grid-template-columns:118px 1fr 92px;gap:11px;align-items:center">
          <span style="font-size:12.5px;color:${none?"var(--alert)":"var(--ink-2)"};${none?"font-weight:600":""}">${b.label}</span>
          <span style="display:block;height:17px;background:var(--rule);border-radius:4px;overflow:hidden">
            <span style="display:block;height:100%;width:${Math.round((b.n/max)*100)}%;border-radius:4px;
              background:${none?"var(--alert)":"var(--accent)"};${none?"":`opacity:${alpha}`}"></span>
          </span>
          <span style="font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right">
            ${b.n}${b.share!=null? html`<span style="color:var(--ink-3)"> · %${b.share}</span>`:null}
          </span>
        </div>`;
      })}
    </div>
  </div>`;
}

function ProbeForm({ onAdded }){
  const blank=()=>({ label:"", channel:"whatsapp", city:"", treatment:"", language:"",
                     sent_at: toLocalInput(new Date()), first_reply_at:"", note:"" });
  const [f,setF]=useState(blank());
  const [busy,setBusy]=useState(false);
  const set=(k,v)=> setF({...f,[k]:v});
  const save=async()=>{
    setBusy(true);
    try{
      await api("/benchmark",{method:"POST",body:JSON.stringify({
        ...f,
        sent_at: new Date(f.sent_at).toISOString(),
        first_reply_at: f.first_reply_at? new Date(f.first_reply_at).toISOString() : null,
      })});
      setF(blank()); showToast(T("bm.added")); await onAdded();
    }catch(e){ showToast(e.message,"error"); }
    finally{ setBusy(false); }

  // Sınıf şart: bu satırlar satır içi grid ve telefonda tek sütuna düşmeleri
  // gerekiyor. Özellikle iki datetime-local alanı yan yana 400px'e sığmıyor —
  // tarayıcı onlara büyük bir asgari genişlik veriyor ve sayfa yana kayıyor.
  const row="display:grid;grid-template-columns:1fr 1fr;gap:8px";
  return html`<div class="glass" style="padding:16px 18px">
    <div style="font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">${T("bm.addTitle")}</div>
    <div class="sub" style="margin:0 0 12px;font-size:12.5px">${T("bm.addSub")}</div>

        <select value=${f.channel} disabled=${busy} onChange=${(e)=>set("channel",e.target.value)}>

        <input value=${f.city} disabled=${busy} placeholder=${T("bm.city")} onInput=${(e)=>set("city",e.target.value)}/>
        <input value=${f.treatment} disabled=${busy} placeholder=${T("bm.treatment")} onInput=${(e)=>set("treatment",e.target.value)}/>
      </div>
      <div class="bm-frow" style=${row}>
        <label style="font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px">${T("bm.sentAt")}
          <input type="datetime-local" value=${f.sent_at} disabled=${busy} onInput=${(e)=>set("sent_at",e.target.value)}/></label>
        <label style="font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px">${T("bm.replyAt")}
          <input type="datetime-local" value=${f.first_reply_at} disabled=${busy} onInput=${(e)=>set("first_reply_at",e.target.value)}/></label>
      </div>
      <input value=${f.note} disabled=${busy} placeholder=${T("bm.note")} onInput=${(e)=>set("note",e.target.value)}/>
      <button class="btn" disabled=${busy||!f.label.trim()||!f.sent_at} onClick=${save}>
        ${busy? html`<${Spinner}/>` : T("bm.add")}
      </button>
    </div>
  </div>`;

function Benchmark(){
  const [d,setD]=useState(null);
  const [err,setErr]=useState(null);
  const [busy,setBusy]=useState("");
  const load=()=> api("/benchmark").then(setD).catch(e=>setErr(e.message));
  useEffect(()=>{ load(); },[]);

  const act=async(id,fn)=>{ setBusy(id); try{ await fn(); await load(); }
    catch(e){ showToast(e.message,"error"); } finally{ setBusy(""); } };
  const markReplied=(p)=> act(p.id, async()=>{
    await api("/benchmark/"+p.id,{method:"PUT",body:JSON.stringify({first_reply_at:new Date().toISOString()})});
    showToast(T("bm.marked"));
  });
  const del=(p)=>{ if(!window.confirm(T("bm.confirmDelete"))) return;
    act(p.id, async()=>{ await api("/benchmark/"+p.id,{method:"DELETE"}); showToast(T("bm.deleted")); }); };

  if(err) return html`<div class="err">${err}</div>`;
  if(!d) return loadingBox();

  const s = d.sample;
  const ours = d.ours;
  const elapsedMin=(p)=> (Date.now() - new Date(p.sent_at).getTime())/60000;
  const status=(p)=>{
    if(p.first_reply_at) return {key:"replied", min:(new Date(p.first_reply_at)-new Date(p.sent_at))/60000};
    return elapsedMin(p) >= s.cutoff_hours*60 ? {key:"none"} : {key:"pending"};
  };

  return html`<div>
    <h1>${T("bm.title")}</h1>
    <div class="sub">${T("bm.sub")}</div>

    <div class="kpis">
      <div class="glass kpi">
        <span class="label">${T("bm.sectorMedian")}</span>
        <span class="val">${s.enough? fmtDur(d.median_minutes) : "–"}</span>
        <span class="foot">${s.enough
          ? `${T("bm.iqr")} ${fmtDur(d.p25_minutes)} – ${fmtDur(d.p75_minutes)}`
          : `${T("bm.needMore")} (${s.settled}/${s.min_sample})`}</span>
      </div>

function Campaigns({ templates, reloadShared }){
  const [tpl,setTpl]=useState(null);
  const [segment,setSegment]=useState("past");
  const [offer,setOffer]=useState(T("campaigns.defaultOffer"));
  const [result,setResult]=useState(null);
  const [busy,setBusy]=useState(false);
  useEffect(()=>{ if(templates.length && !tpl) setTpl(templates[0].key); }, [templates, tpl]);
  const current=templates.find(t=>t.key===tpl);
  const needsOffer=current?.params?.includes("offer");
  const send=async()=>{
    setBusy(true); setResult(null);
    try{
      const r=await api("/campaigns/broadcast",{method:"POST",body:JSON.stringify({template:tpl,segment,variables:needsOffer?{offer}:{}})});
      setResult(r); reloadShared(); showToast(`Broadcast sent to ${r.sent} of ${r.recipients}`);
    }catch(e){ setResult({error:e.message}); } finally{ setBusy(false); }
  };
  return html`<div>
    <h1>${T("campaigns.title")}</h1>
    <div class="sub">${T("campaigns.sub")}</div>
    <div class="glass" style="padding:18px;max-width:620px">
      <label for="campaigns-template" style="display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px">${T("campaigns.template")}</label>
      <select id="campaigns-template" value=${tpl||""} onChange=${(e)=>setTpl(e.target.value)} style="width:100%;margin-bottom:14px">
        ${templates.map(t=> html`<option key=${t.key} value=${t.key}>${t.label}</option>`)}
      </select>
      ${needsOffer? html`<label for="campaigns-offer" style="display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px">${T("campaigns.offerText")}</label>
        <input id="campaigns-offer" value=${offer} onInput=${(e)=>setOffer(e.target.value)} style="width:100%;margin-bottom:14px"/>`:null}
      <label for="campaigns-segment" style="display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px">${T("campaigns.segment")}</label>
      <select id="campaigns-segment" value=${segment} onChange=${(e)=>setSegment(e.target.value)} style="width:100%;margin-bottom:14px">
        <option value="past">${T("seg.past")}</option>
        <option value="hot">${T("kpi.hotLeads")}</option>
        <option value="new">${T("seg.new")}</option>
        <option value="all">${T("seg.all")}</option>
      </select>
      ${current? html`<div class="est" style="background:var(--accent-wash);border-color:var(--accent-line)">
        ${T("campaigns.preview")} ${current.preview.replaceAll("{{1}}","[name]").replace("{{2}}", needsOffer?offer:"[value]")}</div>`:null}
      <button class="btn primary" disabled=${busy||!tpl} onClick=${send}>${busy?T("btn.sending"):T("btn.sendBroadcast")}</button>
      ${result? (result.error
        ? html`<div class="err" style="margin-top:12px">${result.error}</div>`
        : html`<div class="est" style="margin-top:12px">${T("campaigns.sentTo")} ${result.sent}/${result.recipients} ${T("campaigns.recipients")} (${T("campaigns.templateLabel")}: ${result.template}).</div>`):null}
    </div>
  </div>`;
}

function PromptStudio(){
  const [p,setP]=useState(null);
  const [saved,setSaved]=useState(false);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  useEffect(()=>{ api("/settings").then(setP).catch(e=>setErr(e.message)); }, []);
  if(err && !p) return html`<div class="err">${err}</div>`;
  if(!p) return html`<div class="empty"><${Spinner}/> ${T("load.profile")}</div>`;

  const set=(k,v)=>setP({...p,[k]:v});
  const setTr=(i,k,v)=>{ const t=[...p.treatments]; t[i]={...t[i],[k]:v}; setP({...p,treatments:t}); };
  const addTr=()=>setP({...p,treatments:[...(p.treatments||[]),{name:"",priceRange:"",package:""}]});
  const delTr=(i)=>setP({...p,treatments:(p.treatments||[]).filter((_,j)=>j!==i)});
  const langs=Array.isArray(p.languages)?p.languages.join(", "):(p.languages||"");

  const save=async()=>{
    setBusy(true); setSaved(false); setErr(null);
    try{
      const body={
        name:p.name, city:p.city, tone:p.tone,
        languages: Array.isArray(p.languages)?p.languages:String(p.languages).split(",").map(s=>s.trim()).filter(Boolean),
        treatments:(p.treatments||[]).filter(t=>t.name),
        availabilityNote:p.availabilityNote, bookingPolicy:p.bookingPolicy, contact:p.contact,
      };
      const updated=await api("/settings",{method:"PUT",body:JSON.stringify(body)});
      setP(updated); setSaved(true); setTimeout(()=>setSaved(false),2500); showToast(T("toast.profileSaved"));
    }catch(e){ setErr(e.message); } finally{ setBusy(false); }
  };

  return html`<div>
    <h1>${T("studio.title")}</h1>
    <div class="sub">${T("studio.sub")}</div>
    <div style="max-width:720px">
      <div class="glass" style="padding:18px;margin-bottom:14px">
        <label class="fl" for="studio-name">${T("studio.clinicName")}</label><input id="studio-name" value=${p.name||""} onInput=${e=>set("name",e.target.value)} style="width:100%;margin-bottom:12px"/>
        <label class="fl" for="studio-city">${T("studio.city")}</label><input id="studio-city" value=${p.city||""} onInput=${e=>set("city",e.target.value)} style="width:100%;margin-bottom:12px"/>
        <label class="fl" for="studio-langs">${T("studio.languages")}</label><input id="studio-langs" value=${langs} onInput=${e=>set("languages",e.target.value)} style="width:100%;margin-bottom:12px"/>
        <label class="fl" for="studio-tone">${T("studio.tone")}</label><textarea id="studio-tone" onInput=${e=>set("tone",e.target.value)} style="width:100%;min-height:54px">${p.tone||""}</textarea>
      </div>
      <div class="glass" style="padding:18px;margin-bottom:14px">
        <div class="section-title" style="margin-top:0">${T("studio.treatments")}</div>
        ${(p.treatments||[]).map((t,i)=> html`<div key=${i} style="border:1px solid var(--rule);border-radius:var(--r);padding:12px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-size:12px;color:var(--ink-2)">${T("studio.treatmentN")} ${i+1}</span>
            <button class="btn warn" style="padding:4px 10px;font-size:12px" onClick=${()=>delTr(i)}>${T("btn.remove")}</button>
          </div>
          <input placeholder=${T("studio.phName")} value=${t.name||""} onInput=${e=>setTr(i,"name",e.target.value)} style="width:100%;margin-bottom:8px"/>
          <input placeholder=${T("studio.phPrice")} value=${t.priceRange||""} onInput=${e=>setTr(i,"priceRange",e.target.value)} style="width:100%;margin-bottom:8px"/>
          <input placeholder=${T("studio.phPackage")} value=${t.package||""} onInput=${e=>setTr(i,"package",e.target.value)} style="width:100%"/>
        </div>`)}
        <button class="btn" onClick=${addTr}>${T("btn.addTreatment")}</button>
      </div>
      <div class="glass" style="padding:18px;margin-bottom:14px">
        <label class="fl" for="studio-avail">${T("studio.availability")}</label><input id="studio-avail" value=${p.availabilityNote||""} onInput=${e=>set("availabilityNote",e.target.value)} style="width:100%;margin-bottom:12px"/>
        <label class="fl" for="studio-booking">${T("studio.bookingPolicy")}</label><textarea id="studio-booking" onInput=${e=>set("bookingPolicy",e.target.value)} style="width:100%;min-height:54px">${p.bookingPolicy||""}</textarea>
      </div>
      <button class="btn primary" disabled=${busy} onClick=${save}>${busy?T("btn.saving"):T("btn.saveTeach")}</button>
      ${saved? html`<span style="margin-left:12px;color:var(--pos)">${T("studio.saved")}</span>`:null}
      ${err? html`<div class="err" style="margin-top:12px">${err}</div>`:null}
    </div>
  </div>`;
}

function Partners({ partners, reloadShared }){
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const [rate,setRate]=useState("10");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  const [justCreated,setJustCreated]=useState(null); // { name, api_token } — shown once
  const [copied,setCopied]=useState(false);

  const create=async(e)=>{
    e.preventDefault();
    if(!name.trim()) return;
    setBusy(true); setErr(null);
    try{
      const p = await api("/partners",{method:"POST",body:JSON.stringify({name:name.trim(),email:email.trim()||undefined,commissionRate:Number(rate)})});
      setJustCreated(p); setName(""); setEmail(""); setRate("10");
      await reloadShared();
    }catch(ex){ setErr(ex.message); } finally{ setBusy(false); }
  };

  const portalLink = justCreated ? location.origin+"/panel/partner.html?token="+encodeURIComponent(justCreated.api_token) : "";
  const copyLink = async ()=>{
    try{ await navigator.clipboard.writeText(portalLink); setCopied(true); setTimeout(()=>setCopied(false),1600); }catch{}
  };
  const regenerate=async(p)=>{
    if(!window.confirm(T("partners.confirmRegenerate"))) return;
    setBusy(true); setErr(null);
    try{
      const r = await api("/partners/"+p.id+"/regenerate",{method:"POST"});
      setJustCreated(r); await reloadShared();
    }catch(ex){ showToast(ex.message,"error"); } finally{ setBusy(false); }
  };
  const edit=async(p)=>{
    const name=window.prompt(T("admin.name"), p.name); if(name===null||!name.trim()) return;
    const rate=window.prompt(T("partners.commission"), p.commission_rate); if(rate===null) return;
    setBusy(true);
    try{
      await api("/partners/"+p.id,{method:"PATCH",body:JSON.stringify({name:name.trim(),commissionRate:Number(rate)})});
      await reloadShared(); showToast(T("admin.saved"));
    }catch(ex){ showToast(ex.message,"error"); } finally{ setBusy(false); }
  };
  const remove=async(p)=>{
    if(!window.confirm(T("admin.confirmDeletePartner").replace("{name}", p.name))) return;
    setBusy(true);
    try{ await api("/partners/"+p.id,{method:"DELETE"}); await reloadShared(); showToast(T("admin.deleted")); }
    catch(ex){ showToast(ex.message,"error"); } finally{ setBusy(false); }
  };

  return html`<div>
    <h1>${T("nav.partners")}</h1>
    <div class="sub">${T("partners.sub")}</div>

    ${justCreated? html`
      <div class="glass" style=${{padding:"16px 18px",marginBottom:"18px",borderLeft:"3px solid var(--brass)"}}>
        <div style=${{fontWeight:700,marginBottom:8}}>${T("partners.tokenCreated")}</div>
        <div class="note-input" style=${{fontFamily:"var(--mono)",fontSize:"12px",padding:"8px 10px",wordBreak:"break-all"}}>${justCreated.api_token}</div>
        <div style=${{marginTop:10,fontSize:"12px",color:"var(--ink-2)"}}>${T("partners.portalLink")}</div>
        <div style=${{display:"flex",gap:8,marginTop:4}}>
          <div class="note-input" style=${{flex:1,fontFamily:"var(--mono)",fontSize:"11.5px",padding:"8px 10px",wordBreak:"break-all"}}>${portalLink}</div>
          <button class="btn" style=${{flex:"none"}} onClick=${copyLink}>${copied?T("partners.copied"):T("partners.copy")}</button>
        </div>
      </div>`:null}

    <div class="glass" style="padding:18px;max-width:520px;margin-bottom:20px">
      <form onSubmit=${create}>
        <label class="fl" for="partner-name">${T("partners.name")}</label>
        <input id="partner-name" value=${name} onInput=${e=>setName(e.target.value)} style="width:100%;margin-bottom:10px" required/>
        <label class="fl" for="partner-email">${T("partners.email")}</label>
        <input id="partner-email" type="email" value=${email} onInput=${e=>setEmail(e.target.value)} style="width:100%;margin-bottom:10px"/>
        <label class="fl" for="partner-rate">${T("partners.commission")}</label>
        <input id="partner-rate" type="number" min="0" max="100" step="0.5" value=${rate} onInput=${e=>setRate(e.target.value)} style="width:100%;margin-bottom:12px"/>
        <button class="btn primary" type="submit" disabled=${busy||!name.trim()}>${busy?T("btn.saving"):T("partners.create")}</button>
        ${err? html`<div class="err" style="margin-top:10px">${err}</div>`:null}
      </form>
    </div>

    <div class="glass" style="padding:4px 0">
      ${(partners||[]).length===0 ? html`<div class="empty">${T("partners.empty")}</div>` : html`
        <div class="rowgrid rowhead" style="display:grid;grid-template-columns:1.1fr 1.1fr .5fr .45fr 1.5fr;gap:8px;padding:12px 18px;font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--rule)">
          <span>${T("tbl.partner")}</span><span>${T("tbl.email")}</span><span>${T("tbl.rate")}</span><span>${T("tbl.active")}</span><span></span>
        </div>
        ${(partners||[]).map((p,i)=> html`<div key=${i} class="rowgrid" style="display:grid;grid-template-columns:1.1fr 1.1fr .5fr .45fr 1.5fr;gap:8px;padding:13px 18px;font-size:13.5px;border-bottom:1px solid var(--rule);align-items:center">
          <span style="font-weight:700">${p.name}</span>
          <span style="color:var(--ink-2);font-size:12.5px">${p.email||"—"}</span>
          <span>${p.commission_rate}%</span>
          <span>${p.active? "✓" : "—"}</span>
          <span class="rowactions" style="display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap">

          </span>
        </div>`)}
      `}

// Languages the clinic serves, as the ISO codes assignCoordinatorByLanguage
// matches on — a fixed checkbox set rather than free text, so a coordinator
// can't be saved with a language the matcher will never look up.
const STAFF_LANGS=["tr","en","ar","de","ru","fr","it"];
const DEVICE_TYPES=["operating_room","device","chair"];

// Shared by the three management panels below: a row's active switch. Kept in
// one place because the "deactivate, then be able to bring it back" behaviour
// is what makes these rosters safe to edit during a live demo.
function ActiveToggle({ row, busy, onToggle }){
  return html`<button class="btn ${row.active?"":"primary"}"
    style=${{fontSize:"11px",padding:"4px 10px",justifySelf:"end"}}
    disabled=${busy} onClick=${()=>onToggle(row)}>
    ${row.active? T("admin.deactivate") : T("admin.activate")}
  </button>`;
}

function ConsultantAdmin({ branches, onChanged }){
  const [roster,setRoster]=useState(null);
  const [name,setName]=useState("");
  const [langs,setLangs]=useState(["en"]);
  const [branchId,setBranchId]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  const [editing,setEditing]=useState(null); // { id, name, languages, branch_id }

  const load=useCallback(()=>{ api("/consultants/all").then(setRoster).catch(x=>setErr(x.message)); },[]);
  useEffect(()=>{ load(); },[load]);

  const toggleLang=(l)=> setLangs(ls=> ls.includes(l)? ls.filter(x=>x!==l) : [...ls,l]);
  const toggleEditLang=(l)=> setEditing(e=>({...e, languages: e.languages.includes(l)? e.languages.filter(x=>x!==l) : [...e.languages,l]}));

  const create=async(e)=>{
    e.preventDefault(); if(!name.trim()||!langs.length) return;
    setBusy(true); setErr(null);
    try{
      await api("/consultants",{method:"POST",body:JSON.stringify({name:name.trim(),languages:langs,branchId:branchId||undefined})});
      setName(""); setLangs(["en"]); setBranchId("");
      load(); onChanged?.(); showToast(T("admin.consultantAdded"));
    }catch(x){ setErr(x.message); } finally{ setBusy(false); }
  };
  const saveEdit=async()=>{
    if(!editing.name.trim()||!editing.languages.length) return;
    setBusy(true);
    try{
      await api("/consultants/"+editing.id,{method:"PATCH",body:JSON.stringify({
        name:editing.name.trim(), languages:editing.languages, branchId:editing.branch_id||null })});
      setEditing(null); load(); onChanged?.(); showToast(T("admin.saved"));
    }catch(x){ showToast(x.message,"error"); } finally{ setBusy(false); }
  };
  const toggle=async(c)=>{
    setBusy(true);
    try{ await api("/consultants/"+c.id,{method:"PATCH",body:JSON.stringify({active:!c.active})}); load(); onChanged?.(); }
    catch(x){ showToast(x.message,"error"); } finally{ setBusy(false); }
  };
  const remove=async(c)=>{
    if(!window.confirm(T("admin.confirmDeleteConsultant").replace("{name}", c.name))) return;
    setBusy(true);
    try{
      const r=await api("/consultants/"+c.id,{method:"DELETE"});
      load(); onChanged?.();
      showToast(r.leads_unassigned? T("admin.deletedUnassigned").replace("{n}", r.leads_unassigned) : T("admin.deleted"));
    }catch(x){ showToast(x.message,"error"); } finally{ setBusy(false); }
  };

  const grid="display:grid;grid-template-columns:1.2fr 1fr .9fr 1.5fr;gap:8px";
  return html`<div style="margin-top:26px">
    <div class="section-title">${T("admin.consultantRoster")}</div>
    <div class="glass" style="padding:18px;max-width:560px;margin-bottom:16px">
      <form onSubmit=${create}>
        <label class="fl" for="cons-name">${T("admin.name")}</label>
        <input id="cons-name" value=${name} onInput=${e=>setName(e.target.value)} style="width:100%;margin-bottom:12px" required/>
        <label class="fl">${T("admin.languages")}</label>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
          ${STAFF_LANGS.map(l=> html`<button key=${l} type="button" class="chip ${langs.includes(l)?"on":""}"
            aria-pressed=${langs.includes(l)} onClick=${()=>toggleLang(l)}>${l.toUpperCase()}</button>`)}
        </div>
        <label class="fl" for="cons-branch">${T("admin.branch")}</label>
        <select id="cons-branch" value=${branchId} onChange=${e=>setBranchId(e.target.value)} style="width:100%;margin-bottom:14px">
          <option value="">${T("admin.noBranch")}</option>
          ${(branches||[]).map(b=> html`<option key=${b.id} value=${b.id}>${b.name}</option>`)}
        </select>
        <button class="btn primary" type="submit" disabled=${busy||!name.trim()||!langs.length}>
          ${busy?T("btn.saving"):T("admin.addConsultant")}
        </button>
        ${err? html`<div class="err" style="margin-top:10px">${err}</div>`:null}
      </form>
    </div>
    <div class="glass" style="padding:4px 0">
      ${!roster? html`<div class="empty"><${Spinner}/> ${T("load.generic")}</div>`
        : roster.length===0? html`<div class="empty">${T("admin.noConsultants")}</div>`
        : html`<div class="rowgrid rowhead" style="${grid};padding:12px 18px;font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--rule)">
            <span>${T("tbl.coordinator")}</span><span>${T("tbl.languages")}</span><span>${T("admin.branch")}</span><span></span>
          </div>
          ${roster.map(c=> editing && editing.id===c.id
            ? html`<div key=${c.id} style="padding:14px 18px;border-bottom:1px solid var(--rule);background:var(--accent-wash)">
                <label class="fl" for=${"edit-name-"+c.id}>${T("admin.name")}</label>
                <input id=${"edit-name-"+c.id} value=${editing.name} onInput=${e=>setEditing({...editing,name:e.target.value})} style="width:100%;max-width:320px;margin-bottom:10px"/>
                <label class="fl">${T("admin.languages")}</label>
                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
                  ${STAFF_LANGS.map(l=> html`<button key=${l} type="button" class="chip ${editing.languages.includes(l)?"on":""}"
                    aria-pressed=${editing.languages.includes(l)} onClick=${()=>toggleEditLang(l)}>${l.toUpperCase()}</button>`)}
                </div>
                <label class="fl" for=${"edit-branch-"+c.id}>${T("admin.branch")}</label>
                <select id=${"edit-branch-"+c.id} value=${editing.branch_id||""} onChange=${e=>setEditing({...editing,branch_id:e.target.value})} style="width:100%;max-width:320px;margin-bottom:12px">
                  <option value="">${T("admin.noBranch")}</option>
                  ${(branches||[]).map(b=> html`<option key=${b.id} value=${b.id}>${b.name}</option>`)}
                </select>
                <div style="display:flex;gap:6px">
                  <button class="btn primary" disabled=${busy||!editing.name.trim()||!editing.languages.length} onClick=${saveEdit}>${T("btn.save")}</button>
                  <button class="btn" disabled=${busy} onClick=${()=>setEditing(null)}>${T("btn.cancel")}</button>
                </div>
              </div>`
            : html`<div key=${c.id} class="rowgrid" style="${grid};padding:13px 18px;font-size:13.5px;border-bottom:1px solid var(--rule);align-items:center">
                <span style="font-weight:700">${c.name}${c.active?null:html` <span class="badge">${T("admin.inactive")}</span>`}</span>
                <span style="color:var(--ink-2);font-size:12px">${(c.languages||[]).map(x=>x.toUpperCase()).join(', ')}</span>
                <span style="color:var(--ink-2);font-size:12.5px">${(branches||[]).find(b=>b.id===c.branch_id)?.name || T("admin.noBranch")}</span>
                <span class="rowactions" style="display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap">
                  <button class="btn" style=${{fontSize:"11px",padding:"4px 9px"}} disabled=${busy}
                    onClick=${()=>setEditing({id:c.id,name:c.name,languages:[...(c.languages||[])],branch_id:c.branch_id||""})}>${T("btn.edit")}</button>
                  <${ActiveToggle} row=${c} busy=${busy} onToggle=${toggle}/>
                  <button class="btn warn" style=${{fontSize:"11px",padding:"4px 9px"}} disabled=${busy} onClick=${()=>remove(c)}>${T("btn.delete")}</button>
                </span>
              </div>`)}`}
    </div>
  </div>`;
}

// Sean Ellis PMF Sorusu.
//
// "Bu ürünü artık kullanamasanız ne hissederdiniz?" Eşik (%40 "çok hayal
// kırıklığına uğrarım") bizim seçimimiz değil, metodolojinin kendisinden
// (pmfSurvey.js). Koordinatör seçmek İSTEĞE BAĞLI: zorunlu tutmak küçük
// bir ekipte anonimliği (ve dolayısıyla dürüst cevabı) bozardı.
const PMF_OPTIONS = [
  ["very_disappointed","pmf.very"],
  ["somewhat_disappointed","pmf.somewhat"],
  ["not_disappointed","pmf.not"],
];

function PmfSurveyWidget({ data: coordinators }){
  const [stats,setStats]=useState(null);
  const [coordId,setCoordId]=useState("");
  const [answer,setAnswer]=useState("");
  const [reason,setReason]=useState("");
  const [busy,setBusy]=useState(false);
  const load=()=> api("/pmf-survey").then(setStats).catch(()=>{});
  useEffect(()=>{ load(); },[]);

  const submit=async()=>{
    setBusy(true);
    try{
      await api("/pmf-survey",{method:"POST",body:JSON.stringify({
        coordinatorId: coordId||null, answer, reason: reason.trim()||null,
      })});
      setAnswer(""); setReason(""); showToast(T("pmf.thanks")); await load();
    }catch(e){ showToast(e.message,"error"); }
    finally{ setBusy(false); }
  };

  return html`<div class="glass" style="padding:16px 18px;margin-bottom:16px">
    <div class="section-title" style="margin-top:0">${T("pmf.title")}</div>
    <div class="sub" style="margin:-4px 0 12px">${T("pmf.sub")}</div>

    ${stats? html`<div class="kpis" style="margin-bottom:14px">
      <div class="glass kpi"><span class="label">${T("pmf.veryShare")}</span>
        <span class="val ${stats.signal===true?"mint":stats.signal===false?"alert":""}">${stats.shares.very_disappointed==null? "–" : "%"+stats.shares.very_disappointed}</span>
        <span class="foot">${stats.enough? T("pmf.threshold").replace("{n}",stats.threshold_pct) : `${T("pmf.needMore")} (${stats.total}/${stats.min_responses})`}</span></div>
      <div class="glass kpi"><span class="label">${T("pmf.total")}</span>
        <span class="val">${stats.total}</span>
        <span class="foot">${T("pmf.totalFoot")}</span></div>
    </div>`:null}

    <div style="display:flex;flex-direction:column;gap:8px;max-width:520px">
      <div style="font-weight:600;font-size:13.5px">${T("pmf.question")}</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${PMF_OPTIONS.map(([v,label])=> html`<label key=${v} style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
          <input type="radio" name="pmf-answer" value=${v} checked=${answer===v} onChange=${()=>setAnswer(v)}/>
          ${T(label)}
        </label>`)}
      </div>
      <select value=${coordId} disabled=${busy} onChange=${(e)=>setCoordId(e.target.value)} style="font-size:12.5px;max-width:220px">
        <option value="">${T("pmf.anonymous")}</option>
        ${(coordinators?.coordinators||[]).map((c)=> html`<option key=${c.id||c.name} value=${c.id}>${c.name}</option>`)}
      </select>
      <input value=${reason} disabled=${busy} placeholder=${T("pmf.reasonPlaceholder")} onInput=${(e)=>setReason(e.target.value)} style="font-size:12.5px"/>
      <button class="btn" style="align-self:flex-start" disabled=${busy||!answer} onClick=${submit}>
        ${busy? html`<${Spinner}/>` : T("pmf.submit")}
      </button>
    </div>
  </div>`;
}

  return html`<div>

function useFetch(path){
  const [d,setD]=useState(null); const [e,setE]=useState(null);
  const load=useCallback(()=>{ api(path).then(setD).catch(x=>setE(x.message)); },[path]);
  useEffect(()=>{ load(); },[load]);
  return [d,e,load];
}
const emptyBox=(txt)=> html`<div class="glass" style="padding:24px;text-align:center;color:var(--ink-2);font-size:13.5px">${txt}</div>`;

const STAGES={
  transfer_status:["pending","arranged","completed"],
  hotel_status:["pending","checked_in","checked_out"],
  appointment_status:["pending","scheduled","done"],
};
// Keyed by l.lead_id in the parent's .map() below, not array index — this
// list re-sorts (ORDER BY updated_at DESC server-side) every time ANY card's
// field is edited, so an index key would let React hand this component's
// pickupAt/pickupLoc/nextAt/nextNote local state (seeded once, only in the
// useState initializer below) to a DIFFERENT patient after a re-sort moved
// someone else into this component's old slot — a coordinator could then
// save one patient's stale draft pickup time/location onto another
// patient's record without any visual sign anything was wrong.
function LogisticsCard({ l, reload }){
  const [pickupAt,setPickupAt] = useState(l.pickup_at? l.pickup_at.slice(0,16) : "");
  const [pickupLoc,setPickupLoc] = useState(l.pickup_location||"");
  const [nextAt,setNextAt] = useState(l.next_appointment_at? l.next_appointment_at.slice(0,16) : "");
  const [nextNote,setNextNote] = useState(l.next_appointment_note||"");
  const [busy,setBusy] = useState(false);
  const [copied,setCopied] = useState(false);

  const upd=async(field,value)=>{ try{ await api("/logistics/"+l.lead_id,{method:"PUT",body:JSON.stringify({[field]:value})}); showToast(T("toast.logisticsUpdated")); reload(); }catch(x){ showToast(x.message,"error");} };

  const saveItinerary = async ()=>{
    setBusy(true);
    try{
      await api("/logistics/"+l.lead_id,{method:"PUT",body:JSON.stringify({
        pickup_at: pickupAt? new Date(pickupAt).toISOString() : null,
        pickup_location: pickupLoc || null,
        next_appointment_at: nextAt? new Date(nextAt).toISOString() : null,
        next_appointment_note: nextNote || null,
      })});
      showToast(T("toast.logisticsUpdated")); await reload();
    }catch(x){ showToast(x.message,"error"); } finally{ setBusy(false); }
  };

  const trackLink = l.view_token ? location.origin+"/panel/itinerary.html?token="+l.view_token : "";
  const copyLink = async ()=>{ try{ await navigator.clipboard.writeText(trackLink); setCopied(true); setTimeout(()=>setCopied(false),1600); }catch{} };
  const sendLink = async ()=>{
    setBusy(true);
    try{ await api("/logistics/"+l.lead_id+"/send",{method:"POST",body:JSON.stringify({language:l.language||"en"})}); showToast(T("logistics.sent")); }
    catch(x){ showToast(x.message,"error"); } finally{ setBusy(false); }
  };

  return html`<div class="glass" style="padding:14px 18px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <span style="font-weight:700">${leadIdentity(l)} ${channelBadge(l.source)}</span>
      <span style="color:var(--ink-2);font-size:12.5px">${l.country||''} ${l.flight_no?('· '+l.flight_no):''}</span></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px">
      ${["transfer_status","hotel_status","appointment_status"].map((f,j)=> html`<div key=${j}>
        <div class="fl" style="margin-bottom:4px">${f.replace('_status','').replace('_',' ')}</div>
        <select aria-label=${f.replace('_status','').replace('_',' ')} value=${l[f]} onChange=${(ev)=>upd(f,ev.target.value)}>
          ${STAGES[f].map(s=> html`<option key=${s} value=${s}>${s}</option>`)}
        </select></div>`)}
    </div>
    <div class="section-title" style=${{fontSize:"11.5px",marginTop:"4px",marginBottom:"8px"}}>${T("logistics.itinerary")}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <div style="flex:1;min-width:180px">
        <div class="fl" style="margin-bottom:4px">${T("logistics.pickupAt")}</div>
        <input aria-label=${T("logistics.pickupAt")} type="datetime-local" value=${pickupAt} onInput=${(e)=>setPickupAt(e.target.value)} style="width:100%;font-size:12.5px"/>
      </div>
      <div style="flex:1;min-width:180px">
        <div class="fl" style="margin-bottom:4px">${T("logistics.pickupLoc")}</div>
        <input value=${pickupLoc} onInput=${(e)=>setPickupLoc(e.target.value)} placeholder=${T("logistics.pickupLocPh")} style="width:100%;font-size:12.5px"/>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <div style="flex:1;min-width:180px">
        <div class="fl" style="margin-bottom:4px">${T("logistics.nextAt")}</div>
        <input aria-label=${T("logistics.nextAt")} type="datetime-local" value=${nextAt} onInput=${(e)=>setNextAt(e.target.value)} style="width:100%;font-size:12.5px"/>
      </div>
      <div style="flex:1;min-width:180px">
        <div class="fl" style="margin-bottom:4px">${T("logistics.nextNote")}</div>
        <input value=${nextNote} onInput=${(e)=>setNextNote(e.target.value)} placeholder=${T("logistics.nextNotePh")} style="width:100%;font-size:12.5px"/>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" style=${{fontSize:"12px"}} disabled=${busy} onClick=${saveItinerary}>${T("logistics.save")}</button>
      <button class="btn" style=${{fontSize:"12px"}} onClick=${copyLink}>${copied?T("partners.copied"):T("logistics.copyLink")}</button>
      <button class="btn primary" style=${{fontSize:"12px"}} disabled=${busy} onClick=${sendLink}>${T("logistics.sendLink")}</button>
    </div>
  </div>`;
}

const AUTOMATIONS=[
  ["auto.1a","auto.1b"],["auto.2a","auto.2b"],["auto.3a","auto.3b"],["auto.4a","auto.4b"],
  ["auto.5a","auto.5b"],["auto.6a","auto.6b"],["auto.7a","auto.7b"],["auto.8a","auto.8b"],["auto.9a","auto.9b"],
];
function Workflow(){
  // Each row's status comes from the server's real feature flags, not from the
  // fact that the code exists — see services/automationStatus.js for why.
  const [status,e]=useFetch("/automations");
  const byKey={}; (status||[]).forEach(r=>{ byKey[r.key]=r; });
  const liveCount=(status||[]).filter(r=>r.live).length;

  return html`<div>
    <h1>${T("workflow.title")}</h1>
    <div class="sub">${T("workflow.sub")}</div>
    ${e? html`<div class="err" style="margin-bottom:14px">${e}</div>`:null}
    ${status? html`<div class="est" style="margin-bottom:16px">
      ${T("workflow.liveCount").replace("{n}", liveCount).replace("{total}", status.length)}
    </div>`:null}
    ${AUTOMATIONS.map(([t,a],i)=>{
      const st=byKey["auto."+(i+1)];
      const badge = !st ? null
        : st.live && !st.needsCheck ? html`<span class="badge human">${T("workflow.live")}</span>`
        : st.live && st.needsCheck ? html`<span class="badge awaiting">${T("workflow.needsCheck")}</span>`
        : html`<span class="badge">${T("workflow.blocked")}</span>`;
      return html`<div class="glass" key=${i} style="padding:13px 18px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span class="badge" style="background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent)">${T("workflow.when")}</span>
          <span style="flex:1;min-width:180px;font-size:13.5px">${T(t)}</span>
          <span style="color:var(--ink-2)">→</span>
          <span class="badge human">${T("workflow.then")}</span>
          <span style="flex:1;min-width:180px;font-size:13.5px">${T(a)}</span>
          ${badge}
        </div>
        ${st && !st.live? html`<div style="margin-top:8px;font-size:12px;color:var(--ink-2)">
          ${T("workflow.needs")} <b>${st.blockedBy}</b></div>`:null}
        ${st && st.live && st.needsCheck? html`<div style="margin-top:8px;font-size:12px;color:var(--ink-2)">
          ${T("workflow.templateNote")}</div>`:null}
      </div>`;
    })}
  </div>`;
}

function Icon({name}){
  return html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML=${{__html:ICONS[name]||""}} />`;
}

// Indeterminate progress ring — see .spinner's own comment for why this
// exists now (every wait used to be a plain text swap, no actual motion).
// `large` is for a standalone/centered use (initial load); the default
// small size sits inline next to a button's own label.
function Spinner({large}){
  return html`<span class="spinner ${large?"lg":""}" role="status" aria-label=${T("load.generic")}/>`;
}

function App(){
  const [tab, setTab] = useState("command");
  const [stats, setStats] = useState(null);
  const [conversations, setConversations] = useState([]);
  const [convTotal, setConvTotal] = useState(0);
  const [loadingMore, setLoadingMore] = useState(false);
  const convLimitRef = useRef(50);
  const [branches, setBranches] = useState([]);
  const [partners, setPartners] = useState([]);
  const [doctors, setDoctors] = useState([]);
  const [roi, setRoi] = useState(null);
  const [responseTime, setResponseTime] = useState(null);
  const [profitability, setProfitability] = useState(null);
  const [branchId, setBranchId] = useState(()=> store("mv-branch", "all"));
  const [handovers, setHandovers] = useState([]);
  const [analytics, setAnalytics] = useState(null);
  const [templates, setTemplates] = useState([]);
  const [consultants, setConsultants] = useState(null);
  const [pendingDeposits, setPendingDeposits] = useState([]);
  const [risks, setRisks] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [fatal, setFatal] = useState(null);

  const branchQs = branchId && branchId!=="all" ? "&branch_id="+encodeURIComponent(branchId) : "";

  const reloadShared = useCallback(async ()=>{
    try{
      const limit = Math.max(50, convLimitRef.current);
      const qs = branchId && branchId!=="all" ? "?branch_id="+encodeURIComponent(branchId) : "";
      const convQs = "?limit="+limit+"&offset=0"+(branchId && branchId!=="all" ? "&branch_id="+encodeURIComponent(branchId) : "");
      const [s,c,h,a,co,pd,rk,br,pt,ro,dc,pf,rt] = await Promise.all([
        api("/stats"+qs),
        api("/conversations"+convQs),
        api("/handovers"+qs),
        api("/analytics"+qs),
        api("/consultants"+qs),
        api("/payments/pending"+qs),
        api("/risk"+qs),
        api("/branches"),
        api("/partners"),
        api("/roi"+qs),
        api("/doctors"),
        api("/profitability"+qs),
        api("/response-time"+qs),
      ]);
      setStats(s);
      setConversations(c.items||[]);
      setConvTotal(c.total||0);
      convLimitRef.current = Math.max(50, (c.items||[]).length);
      setHandovers(h); setAnalytics(a); setConsultants(co); setPendingDeposits(pd); setRisks(rk);
      setBranches(br||[]); setPartners(pt||[]); setRoi(ro); setDoctors(dc||[]); setProfitability(pf); setResponseTime(rt); setFatal(null);
    }catch(e){ setFatal(e.message); }
  }, [branchId]);

  const loadMoreConversations = useCallback(async ()=>{
    if(loadingMore) return;
    setLoadingMore(true);
    try{
      const offset = conversations.length;
      const page = await api("/conversations?limit=50&offset="+offset+branchQs);
      const incoming = page.items||[];
      setConversations((prev)=>{
        const seen = new Set(prev.map((x)=>x.lead_id));
        const merged = prev.concat(incoming.filter((x)=>!seen.has(x.lead_id)));
        convLimitRef.current = Math.max(50, merged.length);
        return merged;
      });
      setConvTotal(page.total||0);
    }catch(e){ showToast(e.message,"error"); }
    finally{ setLoadingMore(false); }
  }, [conversations.length, loadingMore, branchQs]);

  useEffect(()=>{ reloadShared(); api("/templates").then(setTemplates).catch(()=>{}); }, [reloadShared]);
  useInterval(reloadShared, 8000);

  const openLead = async (id)=>{ setSelectedId(id); setTab("inbox"); await api("/conversations/"+id+"/takeover",{method:"POST"}).catch(()=>{}); reloadShared(); };
  const signOut = ()=>{ TOKEN=""; remember("mv-panel-token",""); NEEDS_AUTH=true; renderApp(); };
  const changeBranch = (next)=>{
    setBranchId(next);
    remember("mv-branch", next);
    convLimitRef.current = 50;
  };

  return html`
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12h4l2 5 4-10 2 5h4"/></svg></div>
        <div class="logo">Medi<b>Voyage</b> OS</div>
      </div>
      <div class="live"><span class="dot"></span> ${T("shell.aiLive")}</div>
      <div class="topbar-spacer"></div>
      <select aria-label=${T("branch.label")} value=${branchId} onChange=${(e)=>changeBranch(e.target.value)}
        class="topbar-branch"
        style=${{marginRight:"8px",maxWidth:"180px",fontSize:"12.5px"}}>
        <option value="all">${T("branch.all")}</option>
        ${branches.map((b)=> html`<option key=${b.id} value=${b.id}>${b.name}</option>`)}
      </select>
      <div class="seg">
        <button class="segbtn ${LANG==="tr"?"on":""}" aria-pressed=${LANG==="tr"} onClick=${()=>setLang("tr")}>TR</button>
        <button class="segbtn ${LANG==="en"?"on":""}" aria-pressed=${LANG==="en"} onClick=${()=>setLang("en")}>EN</button>
      </div>
      <button class="btn iconbtn" title=${T("shell.themeToggle")} aria-label=${T("shell.themeToggle")}
        onClick=${()=>setTheme(THEME==="dark"?"light":"dark")}><${Icon} name=${THEME==="dark"?"sun":"moon"}/></button>
      ${TOKEN? html`<button class="btn" onClick=${signOut}>${T("shell.signOut")}</button>`:null}
      <button class="btn" onClick=${reloadShared}>${T("btn.refresh")}</button>
    </div>
    <div class="shell">
      <div class="sidebar">
        ${NAV_GROUPS.map(([group,ids])=> html`
          <div key=${group}>
            <div class="navgroup">${T(group)}</div>
            ${ids.map((id)=>{ const m=NAV_META[id]; const enabled=ENABLED.has(id)||id==="widget";
              return html`<div key=${id} class="navitem ${tab===id?"active":""} ${enabled?"":"disabled"}"
                onClick=${()=>{ if(id==="widget"){ window.open("/panel/widget.html","_blank"); return; } if(ENABLED.has(id)) setTab(id); }}>
                <${Icon} name=${m.icon}/> <span>${T(m.label)}</span>
              </div>`; })}
          </div>`)}
      </div>
      <div class="main">
        ${fatal? html`<div class="err">${T("shell.backendDown")}: ${fatal}. ${T("shell.backendHint")}</div>`:null}
        ${!fatal && stats===null ? html`<div class="initload"><${Spinner} large/> <span>${T("load.generic")}</span></div>` : null}
        <div class="view" key=${tab} hidden=${!fatal && stats===null}>
        <${ErrorBoundary} key=${"eb-"+tab}>
        ${tab==="command" ? html`<${CommandCenter} stats=${stats} analytics=${analytics} handovers=${handovers} risks=${risks} roi=${roi} responseTime=${responseTime} onOpenLead=${openLead} />`
          : tab==="compliance" ? html`<${Compliance} />`
          : tab==="benchmark" ? html`<${Benchmark} />`
          : tab==="inbox" ? html`<${Inbox} conversations=${conversations} selectedId=${selectedId} setSelectedId=${setSelectedId} reloadShared=${reloadShared} pendingDeposits=${pendingDeposits} convTotal=${convTotal} onLoadMore=${loadMoreConversations} loadingMore=${loadingMore} branches=${branches} partners=${partners} doctors=${doctors} />`
          : tab==="analytics" ? html`<${Analytics} analytics=${analytics} profitability=${profitability} />`
          : tab==="campaigns" ? html`<${Campaigns} templates=${templates} reloadShared=${reloadShared} />`
          : tab==="studio" ? html`<${PromptStudio} />`
          : tab==="consultants" ? html`<${Consultants} data=${consultants} branches=${branches} reloadShared=${reloadShared} />`
          : tab==="matching" ? html`<${Matching} data=${consultants} />`
          : tab==="devices" ? html`<${Devices} />`
          : tab==="logistics" ? html`<${Logistics} />`
          : tab==="postop" ? html`<${PostOp} />`
          : tab==="reviews" ? html`<${Reviews} />`
          : tab==="workflow" ? html`<${Workflow} />`
          : tab==="partners" ? html`<${Partners} partners=${partners} reloadShared=${reloadShared} />`
          : tab==="doctors" ? html`<${Doctors} doctors=${doctors} reloadShared=${reloadShared} />`
          : tab==="branches" ? html`<${Branches} reloadShared=${reloadShared} />`
          : null}
        <//>
        </div>
      </div>
    </div>`;
}

// A render error anywhere below used to unmount the whole tree and leave the
// page blank (React does that by design when nothing catches). This boundary
// keeps the shell — topbar, nav, language and theme switches — alive and
// shows what broke instead of a black screen.
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error){ return { error }; }
  componentDidCatch(error, info){ console.error("[panel] render error:", error, info); }
  render(){
    if (!this.state.error) return this.props.children;
    const msg = (this.state.error && this.state.error.message) || String(this.state.error);
    return html`<div class="err">
      <b>${T("err.title")}</b>
      <div style=${{marginTop:"6px",opacity:.85}}>${T("err.hint")}</div>
      <div style=${{marginTop:"8px",fontSize:"12px",fontFamily:"ui-monospace,SFMono-Regular,Menlo,monospace",opacity:.75,wordBreak:"break-word"}}>${msg}</div>
      <button class="btn" style=${{marginTop:"12px"}} onClick=${()=>this.setState({error:null})}>${T("err.retry")}</button>
    </div>`;
  }
}

function Toasts(){
  const [items,setItems]=useState([]);
  useEffect(()=>{
    const h=(e)=>{ const id=Date.now()+Math.random(); setItems(x=>[...x,{id,...e.detail}]);
      setTimeout(()=>setItems(x=>x.filter(i=>i.id!==id)),3200); };
    window.addEventListener("mv-toast",h); return ()=>window.removeEventListener("mv-toast",h);
  },[]);
  return html`<div class="toasts">${items.map(t=> html`<div key=${t.id} class="toast ${t.type}">${t.message}</div>`)}</div>`;
}

// One card, styled from the same tokens as everything else — no new palette.
// Tries the token against a real endpoint before storing it, so a wrong
// entry shows an error right here instead of flashing the app then bouncing
// back to this screen.
function Gate(){
  const [val,setVal] = useState("");
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState(null);

  const submit = async (e)=>{
    e.preventDefault();
    if(!val.trim()) return;
    setBusy(true); setErr(null);
    try{
      const res = await fetch("/api/stats", { headers:{ "Authorization":"Bearer "+val.trim() } });
      if(res.status===401) throw new Error(T("gate.wrongToken"));
      if(!res.ok) throw new Error("HTTP "+res.status);
      setToken(val.trim());
    }catch(ex){ setErr(ex.message); }
    finally{ setBusy(false); }
  };

  return html`<div class="gate-screen">
    <form onSubmit=${submit} class="gate-card">
      <div class="gate-mark"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 5 4-10 2 5h4"/></svg></div>
      <div class="gate-word">Medi<i>Voyage</i></div>
      <div class="gate-kicker">Clinical Command Center</div>
      <div class="gate-rule"></div>
      <div class="gate-field">
        <label>${T("gate.label")}</label>
        <input type="password" autofocus value=${val} onInput=${(e)=>setVal(e.target.value)} placeholder="••••••••••••"/>
      </div>
      ${err? html`<div class="gate-err">${err}</div>`:null}
      <button class="gate-btn" type="submit" disabled=${busy||!val.trim()}>${busy?T("gate.checking"):T("gate.enter")}</button>
      <div class="gate-foot">${T("gate.sub")}</div>
    </form>
  </div>`;
}

// Language and theme changes re-render the whole tree; React reconciles it,
// so component state (open conversation, form drafts) survives the switch.
// NEEDS_AUTH swaps the whole tree for the Gate instead — set by api()'s 401
// handler, cleared by a successful Gate submit.
const _root = ReactDOM.createRoot(document.getElementById("root"));
function renderApp(){
  _root.render(NEEDS_AUTH
    ? html`<${Gate} />`
    : html`<${React.Fragment}><${App} /><${Toasts} /><//>`);
}
renderApp();
</script>
</body>
</html>
