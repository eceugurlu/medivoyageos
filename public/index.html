<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  // Apply the saved theme before the first paint. The main script runs at the
  // end of <body>, so without this a returning dark-mode user would see a
  // flash of the light background on every load. Light is the default for a
  // first-ever visit (matches store("mv-theme","light") in the main script).
  try { document.documentElement.setAttribute("data-theme", localStorage.getItem("mv-theme") || "light"); } catch (e) {}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230e5750'/%3E%3Cpath d='M5 16h5l3 7 5-14 3 7h6' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=Azeret+Mono:wght@400;500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Instrument+Sans:ital,wght@0,400;0,500;1,400&display=swap">
<title>MediVoyage OS — Command Center</title>
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     MediVoyage OS — "clinic ledger"
     A precisely set record, not a glowing dashboard. Hierarchy comes from
     rules, spacing and type; fills and shadows are spent only where something
     genuinely needs lifting. Stone ground, paper sheets, deep petrol ink,
     brass reserved for the one thing that matters on each screen.
     ═══════════════════════════════════════════════════════════════════════ */
  :root{
    /* Light — "clinical white". A cool, printed-form ground rather than a warm
       paper one: the warmth now lives only in the brass accent, which reads as
       a deliberate note against cool grey instead of dissolving into beige. */
    --ground:#eaedef;
    --paper:#ffffff;
    --paper-2:#f4f6f8;
    --sunk:#e0e5e8;
    --ink:#0c1316;
    --ink-2:#4b555b;
    --ink-3:#5f666b; /* darkened from #7f8a90 — that failed WCAG AA (3.5:1 vs white, needs 4.5:1); this passes at 5.8:1 */
    /* rule/rule-2/accent-line darkened from #e3e6e8/#c3ccd1/#9dc3bc — the
       originals read as text-level hairlines but are also load-bearing
       borders on real controls (buttons, inputs, selects) and WCAG 1.4.11
       requires 3:1 for THAT use, not just 1.4.3's 4.5:1 for text. Measured
       (not eyeballed): the old --rule-2 was 1.63:1 against --paper, --rule
       1.30:1, --accent-line 1.63:1 against --accent-wash. Darkened in LINEAR
       RGB space (preserves the cool petrol-grey hue ratio while lowering
       luminance) rather than picked by eye, so the hue family is unchanged —
       this should read as crisper hairlines, not a different color. --rule
       stays a notch lighter (2:1) since most of its uses are decorative
       dividers, not the "essential component" borders 1.4.11 is about.
       --rule-2 is also slightly darker than it needs to be, to leave margin at
       darker-screen/lower-brightness viewing conditions, not just the 3.00
       computed exactly at spec. */
    --rule:#b3b8bb; /* 2.00:1 vs --paper (was #dde3e6 at 1.30:1) */
    --rule-2:#8f969a; /* 3.00:1 vs --paper (was #c3ccd1 at 1.63:1) */
    --accent:#0e5750;
    --accent-2:#126b60; /* darkened from #157a6f — 4.42:1 vs the wash background, needs 4.5:1; this passes at 5.42:1 */
    --accent-wash:#e4efed;
    --accent-line:#728e89; /* 3.01:1 vs --accent-wash (was #9dc3bc at 1.63:1) */
    --brass:#8c6415;
    --brass-wash:#f4ecdb;
    /* A second, rarer accent — a wine/burgundy pulled toward violet rather
       than pure red specifically so it stays clearly distinct from --alert
       under protanopia/deuteranopia simulation (checked, not assumed: raw
       distance 36–41 vs ~46 at normal vision — still a clearly separate
       color under both common red-green deficiencies, not collapsed onto
       the alert color the way a more orange-leaning wine would be).
       9.94:1 vs --paper. Used only for a VIP/high-score marker — never
       redefines what --alert means, so a true clinical emergency is never
       the ambiguous one. */
    --burgundy:#7a2238;
    --burgundy-wash:#f2e9eb;
    --pos:#2e6b4d;
    --pos-wash:#e5efe9;
    --alert:#a02e21;
    --alert-ink:#82251a;
    --alert-wash:#fbe8e5;
    --alert-line:#e6bdb5;
    --chart-a:#0e5750;
    --chart-b:#8c6415;
    --chart-grid:#e6ebee;
    --display:"Lora",Georgia,"Times New Roman",serif; /* was Fraunces — its sharp, high-contrast "wonky" terminals read as severe, not premium; Lora keeps the warmth of a serif without the edge */
    --ui:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"Azeret Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    /* Rounded, not square — sharp corners read as colder/more clinical and
       psychologically less "safe" than soft ones; this is a deliberate
       reversal of the original "ledger, square corners" direction. --r for
       main surfaces (cards, buttons, inputs, bubbles, dialogs); --r-sm for
       small elements (badges, chips, the brand/gate marks) so they don't
       end up looking like rounded pills at their own, smaller scale. */
    --r:14px;
    --r-sm:8px;
    --lift:0 1px 0 rgba(12,19,22,.04), 0 6px 18px rgba(12,19,22,.07);
  }
  :root[data-theme="dark"]{
    /* Dark cooled to match: a blue-green near-black, not a warm one. */
    --ground:#0e1315;
    --paper:#161c1f;
    --paper-2:#1b2225;
    --sunk:#111618;
    --ink:#e6eaec;
    --ink-2:#9aa4a9;
    --ink-3:#818b91; /* lightened from #6c767b — that failed WCAG AA (3.7:1 vs the panel background, needs 4.5:1); this passes at 4.95:1 */
    /* Same WCAG 1.4.11 fix as the light theme above, mirrored: in dark mode
       the border is LIGHTER than the near-black background, so these are
       lightened (not darkened) to reach the same 3:1/2:1 targets. */
    --rule:#414e53; /* 2.00:1 vs --paper (was #232b2e at 1.52:1 vs ground) */
    --rule-2:#58686f; /* 2.97:1 vs --paper (was #323c40 at 1.52:1) */
    --accent:#5fb3a4;
    --accent-2:#7cc9ba;
    --accent-wash:#152825;
    --accent-line:#48756e; /* 2.97:1 vs --accent-wash (was #2c4b46 at 1.62:1) */
    --brass:#d3a45c;
    --brass-wash:#2a2318;
    --burgundy:#f74e79; /* 5.18:1 vs --paper (dark) — lightened, same violet-leaning hue as the light-mode value */
    --burgundy-wash:#2d2128;
    --pos:#6fb389;
    --pos-wash:#182a20;
    --alert:#e07a68;
    --alert-ink:#f0a396;
    --alert-wash:#2d1a17;
    --alert-line:#4b2a25;
    --chart-a:#5fb3a4;
    --chart-b:#d3a45c;
    --chart-grid:#232b2e;
    --lift:0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.3);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--ui);
    font-size:14px;
    line-height:1.5; /* was 1.55 — just over the 1.40–1.50 body-text range */
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection{background:var(--brass-wash);color:var(--ink)}
  *::-webkit-scrollbar{width:11px;height:11px}
  *::-webkit-scrollbar-thumb{background:var(--rule-2);border:3px solid transparent;background-clip:padding-box;border-radius:99px}
  *::-webkit-scrollbar-track{background:transparent}
  #root{min-height:100vh;display:flex;flex-direction:column}

  /* ── Sheets ──────────────────────────────────────────────────────────────
     The former "glass" card. Paper on a stone desk: a hairline edge, a barely
     perceptible lift, square corners. No blur, no glow. */
  .glass{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r)}

  /* ── Masthead ─────────────────────────────────────────────────────────── */
  .topbar{
    display:flex;align-items:center;gap:18px;padding:0 26px;height:58px;
    position:sticky;top:0;z-index:20;
    background:var(--ground);border-bottom:1px solid var(--rule-2);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand-mark{
    width:27px;height:27px;border-radius:var(--r-sm);display:grid;place-items:center;
    background:var(--accent);color:var(--paper);
  }
  .logo{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.015em}
  .logo b{font-weight:600;color:var(--accent)}
  .live{
    display:flex;align-items:center;gap:7px;
    font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-2);padding-left:16px;border-left:1px solid var(--rule);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--pos);flex:none}
  .topbar-spacer{flex:1}

  /* Language switch: two words divided by a rule, not a pill toggle. */
  .seg{display:flex;align-items:center;border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden;flex:none}
  .segbtn{
    border:0;background:transparent;color:var(--ink-3);font-family:var(--mono);
    font-size:10.5px;font-weight:500;letter-spacing:.09em;padding:9px 13px;cursor:pointer; /* was 6px 10px — a 2-letter toggle used often enough to earn a real target */
    min-height:32px;display:inline-flex;align-items:center;
  }
  .segbtn + .segbtn{border-left:1px solid var(--rule-2)}
  .segbtn:hover{color:var(--ink);background:var(--paper-2)}
  .segbtn.on{background:var(--accent);color:var(--paper)}

  /* ── Controls ─────────────────────────────────────────────────────────── */
  .btn{
    font-family:var(--ui);font-size:12.5px;font-weight:600;letter-spacing:.005em;line-height:1.3;
    color:var(--ink);background:var(--paper);border:1px solid var(--rule-2);
    border-radius:var(--r);padding:9px 16px;cursor:pointer;white-space:nowrap;
    min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px; /* 40×40px desktop tap target (Microsoft HIG) — was ~33px tall */
    transition:background .13s,border-color .13s,color .13s;
  }
  .btn:hover{background:var(--paper-2);border-color:var(--ink-3)}
  .btn:active{background:var(--sunk)}
  .btn:disabled{opacity:.42;cursor:default;background:var(--paper)}
  .btn:focus-visible,.segbtn:focus-visible,.chip:focus-visible,.navitem:focus-visible{
    outline:2px solid var(--brass);outline-offset:2px;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fbfaf7}
  .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  :root[data-theme="dark"] .btn.primary{color:#0f1312}
  .btn.warn{color:var(--alert-ink);border-color:var(--alert-line);background:var(--alert-wash)}
  .btn.warn:hover{background:var(--alert-wash);border-color:var(--alert)}
  .iconbtn{padding:9px 12px;font-size:13px;line-height:1.2;min-width:40px} /* was 6px 10px — inherits .btn's 40px min-height, min-width makes icon-only buttons a real square target instead of a narrow strip */
  .iconbtn svg{width:15px;height:15px;display:block}
  /* Toolbar buttons must not wrap, but the full-width action in the patient
     profile carries a whole sentence and was being clipped by that rule. */
  .profile .btn{white-space:normal;line-height:1.35}

  /* ── Frame ────────────────────────────────────────────────────────────── */
  .shell{display:flex;flex:1;min-height:0}
  .sidebar{
    width:224px;flex:none;padding:20px 0 28px;overflow:auto;
    border-right:1px solid var(--rule);background:var(--ground);
  }
  .navgroup{
    font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.14em; /* was 9.5px — under the 10pt caption floor */
    text-transform:uppercase;color:var(--ink-3);
    padding:18px 26px 7px;
  }
  .sidebar > div:first-child .navgroup{padding-top:0}
  /* Nav items are rows in an index, not buttons. The active one is marked by a
     brass rule in the margin — the only brass on the screen at rest. */
  .navitem{
    display:flex;align-items:center;gap:10px;position:relative;
    padding:7px 26px;color:var(--ink-2);font-size:13.5px;font-weight:400;
    cursor:pointer;transition:color .13s;
  }
  .navitem svg{width:15px;height:15px;flex:none;opacity:.6;transition:opacity .13s}
  .navitem:hover{color:var(--ink)}
  .navitem:hover svg{opacity:.9}
  .navitem.active{color:var(--ink);font-weight:600}
  .navitem.active svg{opacity:1;color:var(--accent)}
  .navitem.active::before{
    content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--brass);
  }
  .navitem.disabled{opacity:.32;cursor:not-allowed}
  .navitem.disabled:hover{color:var(--ink-2)}

  .main{flex:1;min-width:0;overflow:auto;padding:30px 34px 56px;background:var(--ground)}
  .view{max-width:1180px}

  /* ── Page heads ───────────────────────────────────────────────────────── */
  h1{
    font-family:var(--display);font-weight:600;font-size:27px;line-height:1.25; /* was 1.15 — tight even for a short title; 1.25 gives the serif's descenders room without changing the size */
    letter-spacing:-.018em;margin:0 0 5px;text-wrap:balance;
  }
  .sub{color:var(--ink-2);font-size:13.5px;margin:0 0 26px;max-width:74ch;line-height:1.55}

  /* Section title with a rule running to the end of the line — a ledger
     device, and it does real work: it closes the block it opens. */
  .section-title{
    display:flex;align-items:center;gap:12px;
    font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:-.01em;
    margin:0 0 15px;color:var(--ink);
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--rule)}
  .clin-title{color:var(--alert)}
  .clin-title::after{background:var(--alert-line)}

  /* ── KPI band ─────────────────────────────────────────────────────────────
     Was six floating cards. Now one ruled band: shared baseline, hairline
     dividers, numbers set in the display serif. This is the change that makes
     the screen read as ordered rather than assembled. */
  .kpis > *{min-width:0}
  .kpis{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));
    gap:1px;background:var(--rule);
    border:1px solid var(--rule);border-radius:var(--r);
    margin-bottom:28px;overflow:hidden;
  }
  /* The 1px grid gap *is* the divider — it stays a perfect hairline lattice
     however many cells wrap onto a second row. */
  /* KPI cells carry .glass in the markup; inside the band the lattice provides
     the edges, so the sheet border is neutralised here rather than in 30 tags. */
  .kpis .glass{border:0;border-radius:0}
  .kpi{
    padding:15px 18px 16px;position:relative;background:var(--paper);
    display:flex;flex-direction:column;gap:0;
  }
  .kpi .label{
    font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.13em; /* was 9.5px — under the 10pt caption floor */
    text-transform:uppercase;color:var(--ink-3);
  }
  .kpi .val{
    font-family:var(--display);font-weight:600;font-size:33px;line-height:1.12;
    letter-spacing:-.02em;margin-top:9px;color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .kpi .val.cyan{color:var(--accent)}
  .kpi .val.mint{color:var(--pos)}
  .kpi .val.alert{color:var(--alert)}
  .kpi .foot{color:var(--ink-3);font-size:11.5px;margin-top:7px;line-height:1.4}
  /* The icon is a quiet marginal mark, not a filled tile. */
  .kpi-ico{position:absolute;top:15px;right:16px;color:var(--ink-3);opacity:.5}
  .kpi-ico.mint{color:var(--pos)}
  .kpi-ico.alert{color:var(--alert);opacity:.8}
  .kpi-ico svg{width:15px;height:15px;display:block}

  /* ── Action rows ──────────────────────────────────────────────────────── */
  .action-card{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:13px 17px;margin-bottom:8px;
    background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);
  }
  .action-left{display:flex;flex-direction:column;gap:3px;min-width:0}
  .action-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .action-reason{color:var(--ink-2);font-size:12.5px;line-height:1.45}
  /* Fill is spent here and nowhere else: this is the row that needs a person. */
  .alert-card{background:var(--alert-wash)!important;border-color:var(--alert-line)!important;box-shadow:inset 2px 0 0 var(--alert)}

  /* ── Badges ───────────────────────────────────────────────────────────── */
  .badge{
    font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.09em; /* was 9.5px — under the 10pt caption floor */
    text-transform:uppercase;padding:2px 6px;border-radius:var(--r-sm);
    border:1px solid var(--rule-2);color:var(--ink-2);background:transparent;white-space:nowrap;
  }
  .badge.hot{color:var(--alert);border-color:var(--alert-line);background:var(--alert-wash)}
  .badge.human{color:var(--pos);border-color:var(--pos);background:var(--pos-wash)}
  .badge.urgent{color:#fbfaf7;background:var(--alert);border-color:var(--alert)}
  :root[data-theme="dark"] .badge.urgent{color:#0f1312}

  /* The patient spoke last: the clinic owes a reply. Brass, because on this
     screen that is the thing a coordinator is looking for. */
  .badge.awaiting{color:var(--brass);border-color:var(--brass);background:var(--brass-wash)}
  .conv-item.awaits{box-shadow:inset 2px 0 0 var(--brass)}
  .offhours{color:var(--alert)}

  /* A high-score lead with nothing else more urgent to show (not awaiting
     reply, not escalated) still deserves to stand out in a long list — this
     is the ONLY place burgundy appears outside the gate screen, and only
     when it's genuinely informative (score ≥ VIP_SCORE_THRESHOLD in the JS),
     never decorative. */
  .badge.vip{color:var(--burgundy);border-color:var(--burgundy);background:var(--burgundy-wash);font-weight:600}

  /* ── Internal notes ───────────────────────────────────────────────────── */
  .notes{margin-top:4px}
  .note-input{
    width:100%;min-height:58px;max-height:150px;resize:vertical;
    background:var(--paper);border:1px solid var(--rule-2);border-radius:var(--r);
    color:var(--ink);padding:9px 11px;font-family:var(--ui);font-size:12.5px;line-height:1.5;
  }
  .note-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .note{
    margin-top:10px;padding:10px 12px;border-radius:var(--r);
    background:var(--paper-2);border:1px solid var(--rule);
    font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;
  }
  .note-meta{
    font-family:var(--mono);font-size:10px;letter-spacing:.06em; /* was 9px — under the 10pt caption floor */
    color:var(--ink-3);margin-bottom:5px;
  }
  .note-empty{margin-top:12px;color:var(--ink-3);font-size:12px}
  .dep-flag{color:var(--brass);font-weight:600}

  /* ── Inbox ────────────────────────────────────────────────────────────── */
  .inbox{display:grid;grid-template-columns:300px 1fr 290px;gap:16px;height:calc(100vh - 178px);min-height:460px}
  /* A grid item's default min-width is auto, i.e. it refuses to shrink below
     its own min-content width. One long unbreakable string — an E.164 number,
     an Arabic message with no spaces to break on — is then enough to push a
     column past the screen edge, and because the overflow is clipped rather
     than scrolled it reads as "the layout is fine" while content sits off
     screen. min-width:0 lets these columns actually take the width they are
     given; overflow-wrap handles the long strings inside them. */
  .col{overflow:auto;padding:0;min-width:0}
  .inbox > *{min-width:0}
  .msgs,.msg,.conv-item{overflow-wrap:anywhere}
  .filters{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
  /* Mono uppercase runs wide; tightened so the full filter set holds one line
     in the 300px column instead of orphaning the last chip. */
  .chip{
    font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.03em;text-transform:uppercase; /* was 9.5px — under the 10pt caption floor */
    padding:4px 7px;border-radius:var(--r-sm);border:1px solid var(--rule-2);
    background:transparent;color:var(--ink-3);cursor:pointer;transition:.13s;
    min-height:32px;display:inline-flex;align-items:center; /* Fitts's Law: a filter chip is a real tap target, not just a text run */
  }
  .chip:hover{color:var(--ink);border-color:var(--ink-3)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fbfaf7}
  :root[data-theme="dark"] .chip.on{color:#0f1312}
  .chip .ct{opacity:.65;margin-left:5px}
  .search{margin:0 0 2px}

  .conv-item{
    padding:12px 16px;border-bottom:1px solid var(--rule);cursor:pointer;
    border-left:2px solid transparent;transition:background .12s;
  }
  .conv-item:hover{background:var(--paper-2)}
  .conv-item.sel{background:var(--accent-wash);border-left-color:var(--accent)}
  .conv-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .conv-name{font-weight:600;font-size:13px}
  .conv-prev{color:var(--ink-2);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-time{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:5px;text-align:right;letter-spacing:.04em}

  .thread{display:flex;flex-direction:column;height:100%}
  .thread-head{
    padding:13px 17px;border-bottom:1px solid var(--rule);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .banner{
    padding:8px 17px;font-size:12px;font-weight:500;
    background:var(--accent-wash);color:var(--accent);border-bottom:1px solid var(--rule);
  }
  .banner.human{background:var(--pos-wash);color:var(--pos)}
  .msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  /* Messages read as slips of paper. The clinic's own replies carry an accent
     rule on the binding edge, so authorship is legible without colour alone. */
  .bubble{
    max-width:74%;padding:10px 13px;border-radius:var(--r);font-size:13px;line-height:1.5;
    white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--rule);
  }
  .bubble.user{align-self:flex-start;background:var(--paper-2)}
  .bubble.assistant{
    align-self:flex-end;background:var(--accent-wash);border-color:var(--accent-line);
    box-shadow:inset -2px 0 0 var(--accent);
  }
  .bubble .meta{
    display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em; /* was 9px — under the 10pt caption floor */
    color:var(--ink-3);margin-top:7px;
  }
  .composer{border-top:1px solid var(--rule);padding:12px;display:flex;gap:10px;align-items:flex-end}

  /* ── Fields ───────────────────────────────────────────────────────────── */
  textarea,.main input,.main select{
    font-family:var(--ui);font-size:13px;color:var(--ink);
    background:var(--paper);border:1px solid var(--rule-2);border-radius:var(--r);
    padding:9px 11px;transition:border-color .13s,box-shadow .13s;
  }
  textarea{flex:1;resize:none;min-height:42px;max-height:128px;line-height:1.5}
  textarea:focus,.main input:focus,.main select:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash);
  }
  option{background:var(--paper);color:var(--ink)}
  .fl{
    display:block;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.11em; /* was 9.5px — under the 10pt caption floor */
    text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;
  }

  /* ── Profile / ledger rows ────────────────────────────────────────────── */
  .profile{padding:17px}
  .pf-name{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.012em}
  .pf-row{
    display:flex;justify-content:space-between;gap:14px;font-size:12.5px;
    padding:8px 0;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums;
  }
  .pf-row:last-child{border-bottom:0}
  .pf-row .k{color:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding-top:2px}

  .scorebar>i{display:block;height:100%;background:var(--accent);transition:width .45s ease}

  /* ── States ───────────────────────────────────────────────────────────── */
  .empty{
    display:flex;align-items:center;justify-content:center;height:100%;
    color:var(--ink-3);font-size:13px;text-align:center;padding:26px;line-height:1.5;
  }

  /* ── Progress feedback ────────────────────────────────────────────────────
     Until now every wait in this panel was a text swap to "Loading…" — no
     actual motion, so a slow request and a stalled one looked identical.
     An indeterminate ring (this app's data loads are all sub-few-seconds;
     nothing here yet needs the determinate/percentage variant) gives real
     visual confirmation that something is still in flight, same spirit as
     the existing .badge.urgent pulse — spent only where a wait can actually
     happen. Respects prefers-reduced-motion via the blanket rule below. */
  .spinner{
    width:15px;height:15px;flex:none;
    border:2px solid var(--rule-2);border-top-color:var(--accent);border-radius:50%;
    animation:spin .7s linear infinite;
  }
  .spinner.lg{width:22px;height:22px;border-width:2.5px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .initload{
    display:flex;align-items:center;justify-content:center;gap:10px;
    height:50vh;min-height:220px;color:var(--ink-3);font-size:13px;
  }
  .err{
    background:var(--alert-wash);border:1px solid var(--alert-line);
    box-shadow:inset 2px 0 0 var(--alert);
    color:var(--alert-ink);padding:12px 16px;border-radius:var(--r);margin-bottom:16px;font-size:13px;
  }
  .est{
    margin:16px 0;padding:12px 16px;border-radius:var(--r);
    background:var(--accent-wash);border:1px solid var(--accent-line);
    box-shadow:inset 2px 0 0 var(--accent);font-size:13px;
  }
  .est b{color:var(--accent)}
  .med-note{
    margin-top:13px;padding:11px 13px;border-radius:var(--r);
    background:var(--alert-wash);border:1px solid var(--alert-line);
    box-shadow:inset 2px 0 0 var(--alert);
    font-size:12.5px;color:var(--alert-ink);line-height:1.45;
  }
  .med-note .lbl{
    font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--alert);display:flex;align-items:center;gap:6px;margin-bottom:5px;
  }
  .med-note svg{width:13px;height:13px}
  .rtl{direction:rtl;text-align:right}

  /* ── Toasts ───────────────────────────────────────────────────────────── */
  .toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:9px}
  .toast{
    padding:11px 15px;border-radius:var(--r);font-size:12.5px;font-weight:500;
    color:var(--ink);background:var(--paper);border:1px solid var(--rule-2);
    box-shadow:var(--lift);min-width:210px;max-width:340px;
    display:flex;align-items:center;gap:10px;
    box-shadow:inset 2px 0 0 var(--pos), var(--lift);
  }
  .toast.error{box-shadow:inset 2px 0 0 var(--alert), var(--lift);color:var(--alert-ink)}

  /* ── Chart ────────────────────────────────────────────────────────────────
     Styled through classes rather than SVG fill attributes, so every mark takes
     its colour from the same tokens as the surface behind it and both themes
     resolve as a set. */
  .chart-grid{stroke:var(--chart-grid);stroke-width:1}
  .chart-axis{stroke:var(--rule-2);stroke-width:1}
  .chart-label{fill:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.04em} /* was 8px — the smallest text in the whole panel, well under the 10pt caption floor */
  .chart-bar{fill:var(--chart-a)}
  .chart-bar.peak{fill:var(--chart-b)}
  .chart-bar.zero{fill:var(--rule)}

  /* ── Motion ───────────────────────────────────────────────────────────── */
  /* One entrance, 160ms, no travel to speak of. Nothing else moves at rest —
     the urgent badge is the single exception, because it must be noticed. */
  .view{animation:settle .16s ease-out}
  @keyframes settle{from{opacity:0}to{opacity:1}}
  .badge.urgent{animation:urgentpulse 2.2s ease-in-out infinite}
  @keyframes urgentpulse{0%,100%{opacity:1}50%{opacity:.62}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

  /* ── Gate — the welcome screen, deliberately its own moment ─────────────
     Fixed dark treatment regardless of the app's light/dark toggle (like a
     hotel lobby, not a settings page) — Bodoni Moda's extreme thick/thin
     contrast and Instrument Sans read as a private clinical brand, not a
     generic SaaS login card. Everything else in the panel keeps Lora/
     Public Sans; this screen is the one deliberate departure. */
  .gate-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(211,164,92,.10), transparent 60%),
      linear-gradient(160deg, #0a0f10 0%, #0d1517 46%, #0a1210 100%);
    position:relative;overflow:hidden;
  }
  .gate-screen::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:3px 3px;
  }
  .gate-card{position:relative;width:100%;max-width:400px;text-align:center}
  .gate-mark{
    width:46px;height:46px;margin:0 auto 26px;border-radius:var(--r-sm);display:grid;place-items:center;

    box-shadow:0 0 0 1px rgba(211,164,92,.35), 0 18px 40px -12px rgba(15,90,80,.55);
  }
  .gate-word{
    font-family:"Bodoni Moda",Georgia,serif;font-weight:500;font-size:40px;letter-spacing:-.01em;
    color:#f4efe6;line-height:1.05;margin-bottom:6px;
  }
  .gate-word i{font-style:italic;font-weight:400;color:#f74e79} /* was pure brass #d3a45c — a two-ink wordmark (ivory + wine italic), the one deliberate burgundy touch on this screen's own fixed dark treatment */
  .gate-kicker{
    font-family:"Instrument Sans",-apple-system,sans-serif;font-size:11.5px;letter-spacing:.22em;
    text-transform:uppercase;color:#7c9691;margin-bottom:34px;
  }
  .gate-rule{width:36px;height:1px;background:linear-gradient(90deg,transparent,#d3a45c,transparent);margin:0 auto 34px}
  .gate-field{text-align:left;margin-bottom:18px}
  .gate-field label{
    display:block;font-family:"Instrument Sans",sans-serif;font-size:10.5px;letter-spacing:.14em;

  }

    width:100%;background:rgba(255,255,255,.02);border:none;border-bottom:1px solid rgba(211,164,92,.3);

  .gate-btn{

  .gate-btn:hover:not(:disabled){background:#d3a45c;color:#0a0f10}
  .gate-btn:disabled{opacity:.45;cursor:default}
  .gate-err{
    margin-top:16px;font-family:"Instrument Sans",sans-serif;font-size:12.5px;color:#e0a99a;

  }
  .gate-foot{
    margin-top:46px;font-family:"Instrument Sans",sans-serif;font-size:11px;color:#465452;
    letter-spacing:.04em;
  }

  /* ── Responsive ───────────────────────────────────────────────────────── */
  @media (max-width:1120px){
    .inbox{grid-template-columns:1fr;height:auto;min-height:0}
    .inbox>.col:first-child{max-height:300px}
  }
  @media (max-width:760px){
    .sidebar{width:58px}
    .navitem span{display:none}
    .navitem{justify-content:center;padding:9px 0}
    .navgroup{text-align:center;font-size:9px;padding:14px 0 6px;letter-spacing:.08em} /* was 8px — still tight at 58px collapsed width, nudged up without risking wrap */
    .main{padding:20px 16px 40px}
    .kpis{grid-template-columns:1fr 1fr}
    .topbar{padding:0 14px;gap:12px}
    .live{display:none}
  }
  /* The topbar's controls (branch picker, language toggle, theme, sign out,
     refresh) are five separate fixed-size items with no room to sit on one
     line under ~530px — forcing them onto one row pushed the whole page into
     horizontal scroll (a real bug found by rendering the panel at real phone
     widths, not just eyeballing the CSS). Letting the row wrap keeps every
     control reachable instead of clipping any of them. */
  @media (max-width:520px){
    .topbar{flex-wrap:wrap;height:auto;min-height:58px;padding:10px 14px;row-gap:8px}
    .topbar-spacer{display:none}
    .topbar-branch{max-width:130px!important}
  }

  /* ── Management tables on small screens ─────────────────────────────────
     The roster tables (consultants, devices, branches, partners, doctors,
     bookings) are multi-column grids sized for a desktop panel. Left alone at
     phone width the columns collapse to 24–35px — narrower than the words in
     them — and the action buttons render a hundred-plus pixels outside the
     viewport where they cannot be tapped at all. The page reported no
     horizontal scroll the whole time, because the overflow was being clipped
     rather than scrolled, which is exactly why this needed looking at rather
     than measuring.

     Below 900px each row becomes a stacked card instead: one field per line,
     actions on their own row with real tap targets. The column headers are
     hidden because a header row describes columns that no longer exist — each
     value is legible on its own line without one. The !important is load-
     bearing: the grid templates are inline styles on the rows themselves. */
  @media (max-width:900px){
    .rowgrid{grid-template-columns:1fr!important;gap:3px!important;padding:14px 16px!important}
    .rowgrid > *{overflow-wrap:anywhere}
    .rowgrid > *{justify-self:start!important;text-align:left!important;max-width:100%!important}
    .rowgrid.rowhead{display:none!important}
    .rowgrid .rowactions{
      justify-content:flex-start!important;width:100%;margin-top:8px;gap:8px!important;
    }
    .rowgrid .rowactions .btn{padding:7px 12px!important;font-size:12px!important}
    /* Chip filters and any other inline control strip wrap instead of
       extending past the screen edge. */
    .filters{flex-wrap:wrap}
  }
</style>

function store(key, fallback){
  // Private windows and blocked site data make localStorage throw, not just
  // return null — the panel must still render with the default.
  try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
}
function remember(key, value){ try { localStorage.setItem(key, value); } catch (e) {} }

// PANEL_API_TOKEN korumalıysa panel ilk açılışta Gate ekranını gösterir; token
// doğrulanınca burada saklanır ve her api() çağrısına eklenir. Sunucuda token
// ayarlı değilse (lokal geliştirme) her şey normal 200 döner, NEEDS_AUTH hiç
// true olmaz — mevcut geliştirme akışına sıfır sürtünme.
let TOKEN = store("mv-panel-token", "");
let NEEDS_AUTH = false;
function setToken(next){ TOKEN = next; remember("mv-panel-token", next); NEEDS_AUTH = false; renderApp(); }

function T(key){
  const dict = I18N[LANG] || I18N.en;
  return key in dict ? dict[key] : (key in I18N.en ? I18N.en[key] : key);
}
function setLang(next){ LANG = next; remember("mv-lang", next); document.documentElement.lang = next; renderApp(); }
function setTheme(next){ THEME = next; remember("mv-theme", next); applyTheme(); renderApp(); }
function applyTheme(){ document.documentElement.setAttribute("data-theme", THEME); }

const RTL_LANGS = ["ar","fa","he","ur"];

// Medical tourism runs across time zones, and the single easiest way to lose a
// patient's trust is a WhatsApp message at 3am. The dialling code is the only
// location signal that is always present, so the patient's local clock is
// derived from it. Longest prefix wins.
const TZ_BY_DIAL = {
  "1":"America/New_York","7":"Europe/Moscow","20":"Africa/Cairo","31":"Europe/Amsterdam",
  "32":"Europe/Brussels","33":"Europe/Paris","34":"Europe/Madrid","39":"Europe/Rome",
  "41":"Europe/Zurich","43":"Europe/Vienna","44":"Europe/London","45":"Europe/Copenhagen",
  "46":"Europe/Stockholm","47":"Europe/Oslo","48":"Europe/Warsaw","49":"Europe/Berlin",
  "90":"Europe/Istanbul","98":"Asia/Tehran","212":"Africa/Casablanca","213":"Africa/Algiers",
  "351":"Europe/Lisbon","353":"Europe/Dublin","380":"Europe/Kyiv","961":"Asia/Beirut",
  "962":"Asia/Amman","964":"Asia/Baghdad","965":"Asia/Kuwait","966":"Asia/Riyadh",
  "971":"Asia/Dubai","974":"Asia/Qatar","994":"Asia/Baku",
};
function patientZone(phone){
  const digits = String(phone||"").replace(/\D/g,"");
  for (let len = 3; len >= 1; len--){
    const tz = TZ_BY_DIAL[digits.slice(0,len)];
    if (tz) return tz;
  }
  return null;
}
function patientClock(phone){
  const tz = patientZone(phone);
  if (!tz) return null;
  try{
    const now = new Date();
    const time = new Intl.DateTimeFormat(LANG, { hour:"2-digit", minute:"2-digit", timeZone:tz }).format(now);
    const hour = Number(new Intl.DateTimeFormat("en-GB", { hour:"2-digit", hour12:false, timeZone:tz }).format(now));
    return { time, offHours: hour < 8 || hour >= 21 };
  }catch(e){ return null; }
}
// Plain language code, not a flag emoji — a country flag maps awkwardly onto
// a language anyway (AR/EN aren't one country), and this keeps the panel's
// visual language consistent with its custom SVG icon set instead of relying
// on the OS's emoji font.
const flag = (l)=> l? String(l).toUpperCase() : "—";
// Instagram/Messenger leads have no phone (see external_id) and often no
// name yet either, until the AI extracts one from conversation — without a
// fallback, that row would render blank in the Inbox/Action Center.
const CHANNEL_LABEL = { whatsapp: "WhatsApp", widget: "Web", instagram: "Instagram", messenger: "Messenger" };
const leadIdentity = (l)=> l.name || l.phone || (l.external_id ? `${CHANNEL_LABEL[l.source]||"Chat"} user` : "—");
// A small neutral badge naming the channel — shown only for non-WhatsApp
// sources, since WhatsApp is the default/implicit one and doesn't need calling out.
const channelBadge = (source)=> (source && source!=="whatsapp") ? html`<span class="badge">${CHANNEL_LABEL[source]||source}</span>` : null;
const fmtTime=(t)=>{ if(!t) return ""; const d=new Date(t); return d.toLocaleString(LANG, {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); };
const timeAgo=(t)=>{ if(!t) return ""; const s=(Date.now()-new Date(t).getTime())/1000; if(s<45) return T("time.justNow"); if(s<3600) return Math.floor(s/60)+T("time.m"); if(s<86400) return Math.floor(s/3600)+T("time.h"); if(s<604800) return Math.floor(s/86400)+T("time.d"); return new Date(t).toLocaleDateString(LANG); };
function showToast(message,type){ window.dispatchEvent(new CustomEvent("mv-toast",{detail:{message,type:type||"success"}})); }

async function api(path, opts={}){
  const { headers: extraHeaders, ...rest } = opts;
  const res = await fetch("/api"+path, {
    ...rest,
    headers:{
      "Content-Type":"application/json",
      ...(TOKEN?{"Authorization":"Bearer "+TOKEN}:{}),
      ...(extraHeaders||{}),
    },
  });
  if(res.status===401){
    // Saklanan token artık geçersiz (hiç yoktu, yanlıştı ya da sunucu tarafında
    // değişti) — temizle ve Gate'e dön. reloadShared'in 8sn'lik polling'i
    // sırasında birden çok 401 gelebilir; hepsi aynı sonuca varır, zararsız.
    TOKEN = ""; remember("mv-panel-token",""); NEEDS_AUTH = true; renderApp();
    throw new Error(T("gate.sessionExpired"));
  }
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error(e.error||("HTTP "+res.status)); }
  return res.json();
}

// A plain <a href="/api/..."> for a token-gated route 401s — a browser
// navigation never carries the Authorization header api() adds. Fetch
// authenticated, then open the bytes as a blob: url instead.
async function openAuthed(path, { newTab = true } = {}){
  try{
    const res = await fetch("/api"+path, { headers: TOKEN? {"Authorization":"Bearer "+TOKEN} : {} });
    if(!res.ok){ showToast("HTTP "+res.status, "error"); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    if(newTab) window.open(url, "_blank"); else return url;
  }catch(e){ showToast(e.message, "error"); }
}

function useInterval(fn, ms){
  const ref = useRef(fn); ref.current = fn;
  useEffect(()=>{ const id=setInterval(()=>ref.current(), ms); return ()=>clearInterval(id); }, [ms]);
}

// Turns one scored factor back into a sentence a coordinator can argue with.
// The score is only useful if the reasoning behind it is visible.
function riskReasonText(r){
  if(r.factor === "silence")   return `${r.detail} ${T("risk.silence")}`;
  if(r.factor === "imminence") return `${r.detail} ${T("risk.daysLeft")}`;
  if(r.factor === "wording")   return `${T("risk.wording")}: ${r.detail}`;
  if(r.factor === "deposit"){
    if(r.detail === "overdue") return T("risk.depositOverdue");
    if(r.detail === "pending") return T("risk.depositPending");
    return T("risk.depositNone");
  }
  return r.factor;
}

// Photos a patient sent over WhatsApp — the core intake signal for hair/
// dental/aesthetic triage. Fetched as an authenticated blob (plain <img src>
// can't carry the panel's Bearer token) and shown inline in the thread.
function MediaThumb({ messageId }){
  const [src, setSrc] = useState(null);
  useEffect(()=>{
    let objectUrl = null;
    let cancelled = false;
    openAuthed("/messages/"+messageId+"/media", { newTab:false }).then((url)=>{
      if(cancelled){ if(url) URL.revokeObjectURL(url); return; }
      objectUrl = url; setSrc(url);
    });
    return ()=>{ cancelled = true; if(objectUrl) URL.revokeObjectURL(objectUrl); };
  }, [messageId]);
  if(!src) return html`<div class="sub" style=${{fontSize:"11px",margin:"4px 0 0"}}>Loading photo…</div>`;
  return html`<a href=${src} target="_blank" rel="noopener" aria-label=${T("msg.photoAlt")}>
    <img src=${src} alt=${T("msg.photoAlt")} style=${{maxWidth:"200px",borderRadius:"6px",display:"block",marginTop:"6px"}}/>
  </a>`;
}

function Inbox({ conversations, selectedId, setSelectedId, reloadShared, pendingDeposits, convTotal, onLoadMore, loadingMore, branches, partners, doctors }){
  const [detail, setDetail] = useState(null);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [filter, setFilter] = useState("all");
  const [query, setQuery] = useState("");
  const msgsRef = useRef(null);

  // Tracks the CURRENT selection so an in-flight loadDetail() can tell, once
  // its response finally lands, whether it's still the one the coordinator
  // is looking at. Without this: click lead A, click lead B before A's
  // request resolves, and if A's response happens to land after B's (slower
  // payload, network jitter — not exotic), it overwrites `detail` last — the
  // list correctly highlights B, but the thread/profile/notes/payments panel
  // on the right silently shows lead A's data under B's highlighted row.
  const selectedIdRef = useRef(selectedId);
  useEffect(()=>{ selectedIdRef.current = selectedId; }, [selectedId]);

  const loadDetail = useCallback(async (id)=>{
    if(!id){ setDetail(null); return; }
    try{
      const data = await api("/conversations/"+id);
      if(selectedIdRef.current !== id) return; // superseded by a newer selection — discard
      setDetail(data); setErr(null);
    }
    catch(e){ if(selectedIdRef.current === id) setErr(e.message); }
  }, []);

  useEffect(()=>{ loadDetail(selectedId); }, [selectedId, loadDetail]);
  useInterval(()=>{ if(selectedId) loadDetail(selectedId); }, 5000);
  useEffect(()=>{ if(msgsRef.current) msgsRef.current.scrollTop = msgsRef.current.scrollHeight; }, [detail]);

  const act = async (action)=>{
    if(!selectedId) return;
    setBusy(true); setErr(null);
    try{ await api("/conversations/"+selectedId+"/"+action, {method:"POST"}); await loadDetail(selectedId); await reloadShared();
      showToast(action==="takeover"?T("toast.takeover"):T("toast.handback")); }
    catch(e){ setErr(e.message); showToast(e.message,"error"); } finally{ setBusy(false); }
  };
  // Deleting a patient is the only irreversible action in the panel, so it asks
  // twice on purpose: once for intent, once for the name typed back. The API
  // behind it also requires the lead's id echoed in the body, so a mis-fired
  // request can't erase the wrong person even if both prompts are clicked past.
  const removeLead = async ()=>{
    if(!selectedId || !lead) return;
    const who = leadIdentity(lead);
    if(!window.confirm(T("inbox.confirmDelete").replace("{name}", who))) return;
    const typed = window.prompt(T("inbox.confirmDeleteType").replace("{name}", who));
    if(typed === null) return;
    if(typed.trim() !== who){ showToast(T("inbox.deleteNameMismatch"),"error"); return; }
    setBusy(true); setErr(null);
    try{
      await api("/conversations/"+selectedId, {method:"DELETE", body:JSON.stringify({confirmLeadId:selectedId})});
      setSelectedId(null); setDetail(null);
      await reloadShared();
      showToast(T("inbox.deleted").replace("{name}", who));
    }catch(e){ setErr(e.message); showToast(e.message,"error"); } finally{ setBusy(false); }
  };

  // The AI fills these fields in from what the patient writes, so a misheard
  // name or a country guessed from a phone prefix lands on the record — and
  // then on the quote PDF and the itinerary the patient actually receives.
  // This is the only way to correct them.
  const editLeadField = async (field, labelKey, current)=>{
    if(!selectedId) return;
    const v = window.prompt(T(labelKey), current || "");
    if(v === null) return;
    setBusy(true); setErr(null);
    try{
      await api("/conversations/"+selectedId, {method:"PATCH", body:JSON.stringify({[field]: v.trim()})});
      await loadDetail(selectedId); await reloadShared();
      showToast(T("admin.saved"));
    }catch(e){ setErr(e.message); showToast(e.message,"error"); } finally{ setBusy(false); }
  };

  const send = async ()=>{
    const t = text.trim(); if(!t||!selectedId) return;
    setBusy(true); setErr(null);
    try{
      const res = await api("/conversations/"+selectedId+"/reply", {method:"POST", body:JSON.stringify({text:t})});
      setText(""); await loadDetail(selectedId); await reloadShared();
      // The backend already tracks whether the actual send succeeded
      // (res.delivered) — a coordinator seeing a green "sent" toast when the
      // patient never received anything is worse than no toast at all.
      if(res.delivered===false) showToast(T("toast.messageSaveFailedDelivery"),"error");
      else showToast(T("toast.messageSent"));
    }
    catch(e){ setErr(e.message); showToast(e.message,"error"); } finally{ setBusy(false); }
  };
  const discharge = async ()=>{
    if(!selectedId) return;
    // Irreversible from here, and it starts sending the patient messages.
    if(!window.confirm(T("confirm.discharge"))) return;
    setBusy(true); setErr(null);
    try{ await api("/conversations/"+selectedId+"/discharge", {method:"POST"}); await loadDetail(selectedId); await reloadShared(); showToast(T("toast.postopStarted")); }
    catch(e){ setErr(e.message); showToast(e.message,"error"); } finally{ setBusy(false); }
  };

  const lead = detail?.lead; const conv = detail?.conversation;
  const isHuman = conv?.status==="human_handling";
  const rtl = lead && RTL_LANGS.includes(lead.language);

  // A Set keyed by lead_id: O(1) lookup per row instead of re-scanning the
  // pending-deposits array for every conversation on every render.
  // Declared before filtered — the deposit filter closes over this Set.
  const depositLeadIds = new Set((pendingDeposits||[]).map((d)=>d.lead_id));
  const depositCount = depositLeadIds.size;

  const q = query.trim().toLowerCase();
  const filtered = (conversations||[]).filter((c)=>{
    if(filter==="urgent" && !c.urgent) return false;
    if(filter==="human" && c.conv_status!=="needs_human") return false;
    if(filter==="ai" && c.conv_status!=="ai_handling") return false;
    // The patient spoke last, so the ball is on the clinic's side of the net.
    if(filter==="awaiting" && c.last_role!=="user") return false;
    if(filter==="deposit" && !depositLeadIds.has(c.lead_id)) return false;
    if(q && !((c.name||"").toLowerCase().includes(q) || (c.phone||"").includes(q) || (c.external_id||"").toLowerCase().includes(q))) return false;
    return true;
  });
  const urgentCount = (conversations||[]).filter(c=>c.urgent).length;
  const humanCount = (conversations||[]).filter(c=>c.conv_status==="needs_human").length;
  const awaitingCount = (conversations||[]).filter(c=>c.last_role==="user").length;
  const hasMore = (conversations||[]).length < (convTotal||0);
  const showingLabel = T("inbox.showingOf")
    .replace("{shown}", String((conversations||[]).length))
    .replace("{total}", String(convTotal||0));

  return html`
    <div>
      <h1>${T("nav.inbox")}</h1>
      <div class="sub">${T("inbox.sub")}</div>
      ${err?html`<div class="err">${err}</div>`:null}
      <div class="inbox">
        <!-- conversation list -->
        <div class="glass col">
          <div style="padding:12px 12px 2px">
            <input class="search" placeholder=${T("inbox.search")} value=${query} onInput=${(e)=>setQuery(e.target.value)} />
            <div class="filters">
              <span class="chip ${filter==='all'?'on':''}" onClick=${()=>setFilter('all')}>${T("filter.all")}</span>
              <span class="chip ${filter==='urgent'?'on':''}" onClick=${()=>setFilter('urgent')}>${T("filter.urgent")}${urgentCount?html`<span class="ct">${urgentCount}</span>`:null}</span>
              <span class="chip ${filter==='human'?'on':''}" onClick=${()=>setFilter('human')}>${T("filter.needsHuman")}${humanCount?html`<span class="ct">${humanCount}</span>`:null}</span>
              <span class="chip ${filter==='awaiting'?'on':''}" onClick=${()=>setFilter('awaiting')}>${T("filter.awaiting")}${awaitingCount?html`<span class="ct">${awaitingCount}</span>`:null}</span>
              <span class="chip ${filter==='deposit'?'on':''}" onClick=${()=>setFilter('deposit')}>${T("filter.awaitingDeposit")}${depositCount?html`<span class="ct">${depositCount}</span>`:null}</span>
              <span class="chip ${filter==='ai'?'on':''}" onClick=${()=>setFilter('ai')}>${T("filter.ai")}</span>
            </div>
          </div>
          ${filtered.length===0
            ? html`<div class="empty">${(conversations||[]).length===0?T("inbox.noConversations"):T("inbox.noMatch")}</div>`
            : filtered.map((c)=> html`
              <div class="conv-item ${c.lead_id===selectedId?"sel":""} ${c.last_role==="user"?"awaits":""}" key=${c.lead_id} onClick=${()=>setSelectedId(c.lead_id)}>
                <div class="conv-top">
                  <span class="conv-name">${flag(c.language)} ${leadIdentity(c)} ${channelBadge(c.source)}</span>
                  ${c.urgent?html`<span class="badge urgent">${T("badge.urgent")}</span>`
                    : c.conv_status==="needs_human"?html`<span class="badge hot">${T("badge.human")}</span>`
                    : c.last_role==="user"?html`<span class="badge awaiting" title=${T("inbox.awaitingMark")}>${T("filter.awaiting")}</span>`
                    : c.conv_status==="human_handling"?html`<span class="badge human">${T("badge.agent")}</span>`
                    : c.score!=null?(c.score>=85
                        ? html`<span class="badge vip" title=${T("badge.vipHint")}>★ ${c.score}</span>` // VIP_SCORE_THRESHOLD=85 — top of the "ready_to_book" band (see concierge.js's LEAD SCORE rubric), the one case burgundy marks
                        : html`<span class="badge">${c.score}</span>`)
                      :null}
                </div>
                <div class="conv-prev">${c.last_role==="assistant"?"↩ ":""}${c.last_message||"—"}</div>
                <div class="conv-time">${depositLeadIds.has(c.lead_id)?html`<span class="dep-flag" title=${T("payments.pendingBadge")}>€</span> `:null}${timeAgo(c.last_message_at)}</div>
              </div>`)
          }
          ${(convTotal||0)>0? html`<div style=${{padding:"10px 12px 14px",borderTop:"1px solid var(--rule)"}}>
            <div class="sub" style=${{margin:"0 0 8px",fontSize:"12px"}}>${showingLabel}</div>
            ${hasMore? html`<button class="btn" style=${{width:"100%"}} disabled=${loadingMore} onClick=${onLoadMore}>${loadingMore?html`<${Spinner}/> ${T("load.generic")}`:T("inbox.loadMore")}</button>`:null}
          </div>`:null}
        </div>

        <!-- active thread -->
        <div class="glass thread">
          ${!detail? html`<div class="empty">${T("inbox.selectConv")}</div>` : html`
            <div class="thread-head">
              <div><b>${flag(lead.language)} ${leadIdentity(lead)}</b> ${channelBadge(lead.source)} ${lead.phone?html`<span class="sub" style="margin:0">· ${lead.phone}</span>`:null}</div>
              <div style="display:flex;gap:6px;align-items:center">
                ${isHuman
                  ? html`<button class="btn" disabled=${busy} onClick=${()=>act("handback")}>${T("btn.handBack")}</button>`
                  : html`<button class="btn warn" disabled=${busy} onClick=${()=>act("takeover")}>${T("btn.takeOver")}</button>`}
                <button class="btn warn" title=${T("inbox.deleteLead")} aria-label=${T("inbox.deleteLead")}
                  style=${{fontSize:"11px",padding:"5px 10px"}} disabled=${busy} onClick=${removeLead}>${T("btn.delete")}</button>
              </div>
            </div>
            <div class="banner ${isHuman?"human":""}">
              ${isHuman ? T("inbox.youHandling") : T("inbox.aiHandling")}
            </div>
            ${conv?.urgent? html`<div class="banner" style="background:var(--alert-wash);color:var(--alert-ink);font-weight:600">${T("inbox.urgentEsc")}</div>`:null}
            <div class="msgs" ref=${msgsRef}>
              ${(detail.messages||[]).map((m,i)=> html`
                <div class="bubble ${m.role} ${rtl?"rtl":""}" key=${i}>
                  ${m.content}
                  ${m.has_media? html`<${MediaThumb} messageId=${m.id}/>`:null}
                  <span class="meta">${m.role==="assistant"?T("msg.conciergeAgent"):T("msg.patient")} · ${fmtTime(m.created_at)}</span>
                </div>`)}
              ${(detail.messages||[]).length===0?html`<div class="empty">${T("inbox.noMessages")}</div>`:null}
            </div>
            <div class="composer">
              <textarea placeholder=${isHuman?T("inbox.typeReply"):T("inbox.takeOverHint")} value=${text}
                onInput=${(e)=>setText(e.target.value)}
                onKeyDown=${(e)=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } }}></textarea>
              <button class="btn primary" disabled=${busy||!text.trim()} onClick=${send}>${T("btn.send")}</button>
            </div>
          `}
        </div>

        <!-- lead profile -->
        <div class="glass profile">
          ${!lead? html`<div class="empty">${T("inbox.leadDetails")}</div>` : html`
            <div class="pf-name">${flag(lead.language)} ${lead.name||T("pf.unknown")} ${channelBadge(lead.source)}</div>
            <div class="sub" style="margin:2px 0 10px">${lead.country||"—"} · ${lead.phone || (lead.external_id ? `${CHANNEL_LABEL[lead.source]||lead.source} ID: ${lead.external_id}` : "—")}</div>
            <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">
              <button class="btn" style=${{fontSize:"10.5px",padding:"3px 8px"}} disabled=${busy}
                onClick=${()=>editLeadField("name","pf.editName",lead.name)}>${T("pf.editName")}</button>
              <button class="btn" style=${{fontSize:"10.5px",padding:"3px 8px"}} disabled=${busy}
                onClick=${()=>editLeadField("country","pf.editCountry",lead.country)}>${T("pf.editCountry")}</button>
            </div>
            <div class="pf-row"><span class="k">${T("pf.leadScore")}</span><span>${lead.score??"–"}/100</span></div>
            <div class="scorebar"><i style=${{width:(lead.score||0)+"%"}}></i></div>
            <div class="pf-row" style="margin-top:12px"><span class="k">${T("pf.status")}</span><span>${lead.status||"–"}</span></div>
            <div class="pf-row"><span class="k">${T("pf.readiness")}</span><span>${lead.readiness||"–"}</span></div>
            <div class="pf-row"><span class="k">${T("pf.language")}</span><span>${lead.language||"–"}</span></div>
            <div class="pf-row" style=${{alignItems:"center"}}>
              <span class="k">${T("branch.label")}</span>
              <select aria-label=${T("branch.label")} style=${{maxWidth:"160px",fontSize:"12.5px"}} value=${lead.branch_id||""}
                onChange=${async (e)=>{
                  const v = e.target.value || null;
                  try{
                    await api("/conversations/"+lead.id+"/branch",{method:"PUT",body:JSON.stringify({branch_id:v})});
                    showToast(T("toast.branchSaved")); await loadDetail(lead.id); await reloadShared();
                  }catch(ex){ showToast(ex.message,"error"); }
                }}>
                <option value="">${T("branch.none")}</option>
                ${(branches||[]).map((b)=> html`<option key=${b.id} value=${b.id}>${b.name}</option>`)}
              </select>
            </div>
            <div class="pf-row" style=${{alignItems:"center"}}>
              <span class="k">${T("pf.partner")}</span>
              <select aria-label=${T("pf.partner")} style=${{maxWidth:"160px",fontSize:"12.5px"}} value=${lead.partner_id||""}
                onChange=${async (e)=>{
                  const v = e.target.value || null;
                  try{
                    await api("/conversations/"+lead.id+"/partner",{method:"PUT",body:JSON.stringify({partner_id:v})});
                    showToast(T("toast.branchSaved")); await loadDetail(lead.id); await reloadShared();
                  }catch(ex){ showToast(ex.message,"error"); }
                }}>
                <option value="">${T("partner.none")}</option>
                ${(partners||[]).map((p)=> html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}
              </select>
            </div>
            <div class="pf-row" style=${{alignItems:"center"}}>
              <span class="k">${T("pf.doctor")}</span>
              <select aria-label=${T("pf.doctor")} style=${{maxWidth:"160px",fontSize:"12.5px"}} value=${lead.doctor_id||""}
                onChange=${async (e)=>{
                  const v = e.target.value || null;
                  try{
                    await api("/conversations/"+lead.id+"/doctor",{method:"PUT",body:JSON.stringify({doctor_id:v})});
                    showToast(T("toast.branchSaved")); await loadDetail(lead.id); await reloadShared();
                  }catch(ex){ showToast(ex.message,"error"); }
                }}>
                <option value="">${T("doctor.none")}</option>
                ${(doctors||[]).map((d)=> html`<option key=${d.id} value=${d.id}>${d.name}</option>`)}
              </select>
            </div>
            ${lead.doctor_review_status? html`
              <div class="pf-row"><span class="k">${T("tbl.reviewStatus")}</span>
                <span class="badge ${lead.doctor_review_status==='approved'?'human':lead.doctor_review_status==='needs_info'?'urgent':''}">${T("review."+lead.doctor_review_status)}</span></div>
              ${lead.doctor_note? html`<div class="med-note"><span class="lbl">${T("pf.doctor")}</span>${lead.doctor_note}</div>`:null}
            `:null}
            <div class="pf-row" style=${{alignItems:"center"}}><span class="k">${T("pf.treatment")}</span>
              <span style="text-align:right;max-width:150px;display:flex;gap:5px;align-items:center;justify-content:flex-end">
                ${lead.treatment_interest||"–"}
                <button class="btn" title=${T("btn.edit")} aria-label=${T("pf.editTreatment")} style=${{fontSize:"10px",padding:"2px 6px",flex:"none"}}
                  disabled=${busy} onClick=${()=>editLeadField("treatmentInterest","pf.editTreatment",lead.treatment_interest)}>✎</button>
              </span></div>
            <div class="pf-row" style=${{alignItems:"center"}}><span class="k">${T("pf.budget")}</span>
              <span style="display:flex;gap:5px;align-items:center;justify-content:flex-end">
                ${lead.budget_hint||"–"}
                <button class="btn" title=${T("btn.edit")} aria-label=${T("pf.editBudget")} style=${{fontSize:"10px",padding:"2px 6px",flex:"none"}}
                  disabled=${busy} onClick=${()=>editLeadField("budgetHint","pf.editBudget",lead.budget_hint)}>✎</button>
              </span></div>
            <div class="pf-row"><span class="k">${T("pf.crmId")}</span><span>${lead.crm_lead_id||T("pf.notSynced")}</span></div>
            ${(()=>{ const clock = patientClock(lead.phone); return clock? html`
              <div class="pf-row"><span class="k">${T("pf.localTime")}</span>
                <span class=${clock.offHours?"offhours":""}>${clock.time}${clock.offHours?html` · ${T("pf.offHours")}`:null}</span></div>`:null; })()}
            ${lead.medical_note? html`<div class="med-note"><span class="lbl"><${Icon} name="alert"/> ${T("pf.clinicalNote")}</span>${lead.medical_note}</div>`:null}
            <button class="btn" style="width:100%;margin-top:14px" disabled=${busy} onClick=${discharge}>${T("btn.markDischarged")}</button>
            <${Notes} leadId=${lead.id} notes=${detail.notes} onAdded=${()=>loadDetail(lead.id)} />
            <${Payments} leadId=${lead.id} payments=${detail.payments} onChanged=${()=>{ loadDetail(lead.id); reloadShared(); }} />
            <${Costs} leadId=${lead.id} costs=${detail.costs} onChanged=${()=>{ loadDetail(lead.id); reloadShared(); }} />
            <${Quotes} leadId=${lead.id} quotes=${detail.quotes} onChanged=${()=>loadDetail(lead.id)} />
          `}
        </div>
      </div>
    </div>`;
}

// ── Chart + Analytics + Campaigns ───────────────────────────────────────────
// Internal notes: the handover an operations team actually runs on — what one
// coordinator needs to tell the next. Never reaches the patient.
function Notes({ leadId, notes, onAdded }){
  const [text,setText] = useState("");
  const [busy,setBusy] = useState(false);
  const save = async ()=>{
    const body = text.trim();
    if(!body) return;
    setBusy(true);
    try{
      await api("/conversations/"+leadId+"/notes", { method:"POST", body: JSON.stringify({ body }) });
      setText(""); showToast(T("notes.saved")); await onAdded();
    }catch(e){ showToast(e.message,"error"); }
    finally{ setBusy(false); }
  };
  return html`<div class="notes">
    <div class="section-title" style=${{marginTop:"20px",marginBottom:"10px",fontSize:"13px"}}>${T("notes.title")}</div>
    <textarea class="note-input" placeholder=${T("notes.placeholder")} value=${text}
      onInput=${(e)=>setText(e.target.value)}
      onKeyDown=${(e)=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); save(); } }}></textarea>
    <button class="btn" style=${{marginTop:"8px",width:"100%"}} disabled=${busy||!text.trim()} onClick=${save}>${T("notes.add")}</button>
    ${(notes||[]).length===0
      ? html`<div class="note-empty">${T("notes.empty")}</div>`
      : (notes||[]).map((n)=> html`<div class="note" key=${n.id}>
          <div class="note-meta">${n.author||"—"} · ${fmtTime(n.created_at)}</div>
          ${n.body}
        </div>`)}
  </div>`;
}

// Payments: the one number the rest of the app's "real" figures depend on.
// A pending row can be marked paid or nudged with a reminder; nothing here is
// ever visible to the patient — except the hosted Stripe checkout link itself,
// which is the one thing that IS meant to reach them.
const PAYMENT_TYPES = ["deposit","balance","full"];
const PAYMENT_CURRENCIES = ["EUR","USD","GBP","TRY"];
function Payments({ leadId, payments, onChanged }){
  const [amount,setAmount] = useState("");
  const [currency,setCurrency] = useState("EUR");
  const [type,setType] = useState("deposit");
  const [dueDate,setDueDate] = useState("");
  const [busy,setBusy] = useState(false);
  const [linkBusy,setLinkBusy] = useState(false);

  const add = async ()=>{
    const amt = Number(amount);
    if(!amt || amt<=0) return;
    setBusy(true);
    try{
      await api("/conversations/"+leadId+"/payments", { method:"POST", body: JSON.stringify({ amount: amt, currency, type, dueDate: dueDate||null }) });
      setAmount(""); setDueDate(""); showToast(T("toast.paymentAdded")); await onChanged();
    }catch(e){ showToast(e.message,"error"); }
    finally{ setBusy(false); }
  };
  // One click: creates the payment row, generates a checkout link (Stripe or
  // İyzico, picked by currency — see `provider` below) in the chosen
  // currency, and sends it straight to the patient's own channel
  // (WhatsApp/Instagram/Messenger) — no IBAN, no manual follow-up.
  const createLink = async ()=>{
    const amt = Number(amount);
    if(!amt || amt<=0) return;
    setLinkBusy(true);
    try{
      await api("/conversations/"+leadId+"/payments/link", { method:"POST", body: JSON.stringify({ amount: amt, currency, type, dueDate: dueDate||null }) });
      setAmount(""); setDueDate(""); showToast(T("toast.paymentLinkSent")); await onChanged();
    }catch(e){ showToast(e.message,"error"); }
    finally{ setLinkBusy(false); }
  };
  const markPaid = async (id)=>{

// Quotes: the concierge already knows the treatment, so the coordinator
// starts from a suggested draft instead of a blank page, edits the line
// items (never the total — that's always recomputed server-side, see
// updateQuote()), and sends. One card per quote, at most one open for
// editing at a time — this column is 290px wide, not a spreadsheet.
const QUOTE_LANGS = ["en","tr","de","ar","ru","fr"];
function Quotes({ leadId, quotes, onChanged }){
  const [busy,setBusy] = useState(false);
  const [openId,setOpenId] = useState(null);

  const suggest = async ()=>{
    setBusy(true);
    try{
      const q = await api("/conversations/"+leadId+"/quotes/draft", { method:"POST" });
      showToast(T("toast.quoteDrafted")); setOpenId(q.id); await onChanged();
    }catch(e){ showToast(e.message,"error"); }
    finally{ setBusy(false); }
  };

  return html`<div class="notes">
    <div class="section-title" style=${{marginTop:"20px",marginBottom:"10px",fontSize:"13px"}}>${T("quotes.title")}</div>
    <button class="btn" style=${{width:"100%"}} disabled=${busy} onClick=${suggest}>${T("quotes.suggest")}</button>
    ${(quotes||[]).length===0
      ? html`<div class="note-empty">${T("quotes.empty")}</div>`
      : (quotes||[]).map((q)=> html`<${QuoteCard} key=${q.id} quote=${q}
          open=${openId===q.id} onToggle=${()=>setOpenId(openId===q.id?null:q.id)} onChanged=${onChanged} />`)}
  </div>`;
}

function QuoteCard({ quote, open, onToggle, onChanged }){
  const [busy,setBusy] = useState(false);
  const [label,setLabel] = useState("");
  const [qty,setQty] = useState("1");
  const [price,setPrice] = useState("");

  const save = async (items)=>{
    setBusy(true);
    try{ await api("/quotes/"+quote.id, { method:"PUT", body: JSON.stringify({ items }) }); showToast(T("toast.quoteUpdated")); await onChanged(); }
    catch(e){ showToast(e.message,"error"); }
    finally{ setBusy(false); }
  };
  const addItem = async ()=>{
    if(!label.trim() || !price) return;
    await save([...(quote.items||[]), { label: label.trim(), qty: Number(qty)||1, unit_price: Number(price)||0 }]);
    setLabel(""); setQty("1"); setPrice("");
  };
  const removeItem = (i)=> save((quote.items||[]).filter((_,j)=>j!==i));
  const setLang = async (language)=>{ try{ await api("/quotes/"+quote.id,{method:"PUT",body:JSON.stringify({language})}); await onChanged(); }catch(e){ showToast(e.message,"error"); } };
  const send = async ()=>{
    if(!window.confirm(T("quotes.confirmSend"))) return;
    setBusy(true);
    try{ await api("/quotes/"+quote.id+"/send", { method:"POST" }); showToast(T("toast.quoteSent")); await onChanged(); }
    catch(e){ showToast(e.message,"error"); }
    finally{ setBusy(false); }
  };
  const accept = async ()=>{
    try{ await api("/quotes/"+quote.id+"/accept", { method:"POST" }); showToast(T("toast.quoteAccepted")); await onChanged(); }
    catch(e){ showToast(e.message,"error"); }
  };
  const removeQuote = async ()=>{
    if(!window.confirm(T("quotes.confirmDelete"))) return;
    setBusy(true);
    try{ await api("/quotes/"+quote.id, { method:"DELETE" }); showToast(T("admin.deleted")); await onChanged(); }
    catch(e){ showToast(e.message,"error"); } finally{ setBusy(false); }
  };

  const isDraft = quote.status === "draft";
  return html`<div class="note">
    <div class="note-meta" style=${{cursor:"pointer"}} onClick=${onToggle}>
      ${flag(quote.language)} ${quote.currency} ${Number(quote.total_amount).toLocaleString()}
      · <span class="badge ${quote.status==='accepted'?'human':quote.status==='draft'?'':'awaiting'}">${T("quotes.status."+quote.status)}</span>
      · ${fmtTime(quote.created_at)}${quote.valid_until? html` · ${T("quotes.validUntil")}: ${quote.valid_until}`:null}
    </div>
    ${open? html`<div style=${{marginTop:"8px"}}>
      ${(quote.items||[]).length===0? html`<div class="note-empty" style=${{marginTop:"0"}}>${T("quotes.noItems")}</div>`
        : (quote.items||[]).map((it,i)=> html`<div key=${i} style=${{display:"flex",justifyContent:"space-between",gap:"6px",fontSize:"12px",padding:"4px 0",borderBottom:"1px solid var(--rule)"}}>
            <span>${it.label} · ${it.qty} × ${quote.currency} ${Number(it.unit_price).toLocaleString()}</span>
            ${isDraft? html`<button class="btn" title=${T("quotes.remove")} style=${{padding:"1px 6px",fontSize:"11px",flex:"none"}} disabled=${busy} onClick=${()=>removeItem(i)}>×</button>`:null}
          </div>`)}
      ${isDraft? html`<div style=${{display:"flex",gap:"5px",marginTop:"8px"}}>
        <input placeholder=${T("quotes.itemLabel")} value=${label} onInput=${(e)=>setLabel(e.target.value)} style=${{flex:"1",minWidth:"0",fontSize:"12px"}}/>
        <input type="number" min="1" placeholder=${T("quotes.qty")} value=${qty} onInput=${(e)=>setQty(e.target.value)} style=${{width:"46px",fontSize:"12px"}}/>
        <input type="number" min="0" step="0.01" placeholder=${T("quotes.price")} value=${price} onInput=${(e)=>setPrice(e.target.value)} style=${{width:"64px",fontSize:"12px"}}/>
      </div>
      <button class="btn" style=${{marginTop:"6px",width:"100%",fontSize:"11px",padding:"4px"}} disabled=${busy||!label.trim()||!price} onClick=${addItem}>${T("quotes.addItem")}</button>`:null}
      <div style=${{display:"flex",gap:"6px",marginTop:"8px",alignItems:"center"}}>
        ${isDraft? html`<select value=${quote.language} onChange=${(e)=>setLang(e.target.value)} style=${{fontSize:"11px",flex:"none"}}>
          ${QUOTE_LANGS.map((l)=> html`<option key=${l} value=${l}>${flag(l)}</option>`)}
        </select>`:null}
        ${/* Opened as a plain link to the quote's own public token URL rather
             than fetched-then-window.open'd like the panel's other downloads.
             The PDF is rendered by headless Chromium and can take seconds on a
             cold start; a window.open() that far past the click has lost its
             user-gesture context and browsers silently block it as a popup, so
             the button appeared to do nothing. This carries no bearer token by
             design — the /file variant is the same unauthenticated, unguessable
             URL the patient already receives, and unlike the bare token URL it
             does NOT mark the quote "viewed", so previewing it internally can't
             fake a patient having opened it. */ null}
        <a class="btn" style=${{fontSize:"11px",padding:"4px 8px",textDecoration:"none",display:"inline-flex",alignItems:"center"}}
           href=${"/api/public/quote/"+quote.view_token+"/file"} target="_blank" rel="noopener">${T("quotes.preview")}</a>
        ${isDraft? html`<button class="btn warn" style=${{fontSize:"11px",padding:"4px 8px"}} disabled=${busy} onClick=${removeQuote}>${T("btn.delete")}</button>`:null}
        ${isDraft? html`<button class="btn primary" style=${{fontSize:"11px",padding:"4px 8px"}} disabled=${busy||!(quote.items||[]).length} onClick=${send}>${T("quotes.send")}</button>`
          : quote.status!=="accepted"? html`<button class="btn" style=${{fontSize:"11px",padding:"4px 8px"}} onClick=${accept}>${T("quotes.accept")}</button>`:null}
      </div>
    </div>`:null}
  </div>`;
}

function MiniBarChart({ data }){
  // Room reserved in the viewBox for the value labels on the left and the day
  // numbers underneath, so nothing is clipped at the drawing's edge.
  const w=680, h=142, padX=28, padTop=14, padBottom=24;
  const plot = h - padTop - padBottom;
  const max = Math.max(1, ...data.map(d=>d.count));
  const bw = (w-padX*2)/data.length;
  const base = padTop + plot;
  const y = (v)=> base - (v/max)*plot;
  // Reference lines name values the chart actually reaches — the peak and,
  // when there is room between them, its midpoint.
  const mid = Math.round(max/2);
  const ticks = max > 1 && mid > 0 && mid < max ? [max, mid] : [max];
  // The tallest day gets the brass — but only when there is something to be
  // tallest *than*. With a single active day the highlight has no comparison to
  // make and just turns the whole chart into one loud block, so it stays off.
  let peak = -1;
  if (data.filter((d)=>d.count > 0).length > 1) {
    peak = 0;
    data.forEach((d,i)=>{ if(d.count > data[peak].count) peak = i; });
  }
  return html`<svg viewBox="0 0 ${w} ${h}" style=${{width:"100%",height:"auto",display:"block"}} role="img"
                   aria-label=${`${data.reduce((a,d)=>a+d.count,0)} ${T("chart.leads")}`}>
    ${ticks.map((v,i)=> html`<g key=${"t"+i}>
      <line class="chart-grid" x1=${padX} y1=${y(v)} x2=${w-padX} y2=${y(v)}/>
      <text class="chart-label" x=${padX-7} y=${y(v)+3} textAnchor="end">${v}</text>
    </g>`)}
    <line class="chart-axis" x1=${padX} y1=${base} x2=${w-padX} y2=${base}/>
    ${data.map((d,i)=>{
      const bh = (d.count/max)*plot;
      const x = padX + i*bw;
      // Empty days keep a 1px stub on the baseline so the series reads as a
      // continuous fourteen days rather than a few floating bars.
      const drawn = Math.max(bh, 1);
      const cls = d.count ? (i===peak ? "chart-bar peak" : "chart-bar") : "chart-bar zero";
      return html`<g key=${i}>
        <rect class=${cls} x=${x+2} y=${base-drawn} width=${Math.max(1,bw-5)} height=${drawn}>
          <title>${d.count} ${T("chart.leads")}</title></rect>
        <text class="chart-label" x=${x+bw/2} y=${h-8} textAnchor="middle">${Number(d.day.slice(8,10))}</text>
      </g>`;
    })}
  </svg>`;
}

function Campaigns({ templates, reloadShared }){
  const [tpl,setTpl]=useState(null);
  const [segment,setSegment]=useState("past");
  const [offer,setOffer]=useState(T("campaigns.defaultOffer"));
  const [result,setResult]=useState(null);
  const [busy,setBusy]=useState(false);
  useEffect(()=>{ if(templates.length && !tpl) setTpl(templates[0].key); }, [templates, tpl]);
  const current=templates.find(t=>t.key===tpl);
  const needsOffer=current?.params?.includes("offer");
  const send=async()=>{
    setBusy(true); setResult(null);
    try{
      const r=await api("/campaigns/broadcast",{method:"POST",body:JSON.stringify({template:tpl,segment,variables:needsOffer?{offer}:{}})});
      setResult(r); reloadShared(); showToast(`Broadcast sent to ${r.sent} of ${r.recipients}`);
    }catch(e){ setResult({error:e.message}); } finally{ setBusy(false); }
  };
  return html`<div>
    <h1>${T("campaigns.title")}</h1>
    <div class="sub">${T("campaigns.sub")}</div>
    <div class="glass" style="padding:18px;max-width:620px">
      <label for="campaigns-template" style="display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px">${T("campaigns.template")}</label>
      <select id="campaigns-template" value=${tpl||""} onChange=${(e)=>setTpl(e.target.value)} style="width:100%;margin-bottom:14px">
        ${templates.map(t=> html`<option key=${t.key} value=${t.key}>${t.label}</option>`)}

function PromptStudio(){
  const [p,setP]=useState(null);
  const [saved,setSaved]=useState(false);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  useEffect(()=>{ api("/settings").then(setP).catch(e=>setErr(e.message)); }, []);
  if(err && !p) return html`<div class="err">${err}</div>`;
  if(!p) return html`<div class="empty">${T("load.profile")}</div>`;

  const set=(k,v)=>setP({...p,[k]:v});
  const setTr=(i,k,v)=>{ const t=[...p.treatments]; t[i]={...t[i],[k]:v}; setP({...p,treatments:t}); };
  const addTr=()=>setP({...p,treatments:[...(p.treatments||[]),{name:"",priceRange:"",package:""}]});
  const delTr=(i)=>setP({...p,treatments:(p.treatments||[]).filter((_,j)=>j!==i)});
  const langs=Array.isArray(p.languages)?p.languages.join(", "):(p.languages||"");

  const save=async()=>{
    setBusy(true); setSaved(false); setErr(null);
    try{
      const body={
        name:p.name, city:p.city, tone:p.tone,
        languages: Array.isArray(p.languages)?p.languages:String(p.languages).split(",").map(s=>s.trim()).filter(Boolean),
        treatments:(p.treatments||[]).filter(t=>t.name),
        availabilityNote:p.availabilityNote, bookingPolicy:p.bookingPolicy, contact:p.contact,
      };
      const updated=await api("/settings",{method:"PUT",body:JSON.stringify(body)});
      setP(updated); setSaved(true); setTimeout(()=>setSaved(false),2500); showToast(T("toast.profileSaved"));
    }catch(e){ setErr(e.message); } finally{ setBusy(false); }

        <label class="fl" for="studio-langs">${T("studio.languages")}</label><input id="studio-langs" value=${langs} onInput=${e=>set("languages",e.target.value)} style="width:100%;margin-bottom:12px"/>

      </div>
      <div class="glass" style="padding:18px;margin-bottom:14px">
        <div class="section-title" style="margin-top:0">${T("studio.treatments")}</div>
        ${(p.treatments||[]).map((t,i)=> html`<div key=${i} style="border:1px solid var(--rule);border-radius:var(--r);padding:12px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-size:12px;color:var(--ink-2)">${T("studio.treatmentN")} ${i+1}</span>
            <button class="btn warn" style="padding:4px 10px;font-size:12px" onClick=${()=>delTr(i)}>${T("btn.remove")}</button>

          <input placeholder=${T("studio.phName")} value=${t.name||""} onInput=${e=>setTr(i,"name",e.target.value)} style="width:100%;margin-bottom:8px"/>
          <input placeholder=${T("studio.phPrice")} value=${t.priceRange||""} onInput=${e=>setTr(i,"priceRange",e.target.value)} style="width:100%;margin-bottom:8px"/>
          <input placeholder=${T("studio.phPackage")} value=${t.package||""} onInput=${e=>setTr(i,"package",e.target.value)} style="width:100%"/>

// Languages the clinic serves, as the ISO codes assignCoordinatorByLanguage

const STAFF_LANGS=["tr","en","ar","de","ru","fr","it"];

// Shared by the three management panels below: a row's active switch. Kept in
// one place because the "deactivate, then be able to bring it back" behaviour
// is what makes these rosters safe to edit during a live demo.
function ActiveToggle({ row, busy, onToggle }){
  return html`<button class="btn ${row.active?"":"primary"}"
    style=${{fontSize:"11px",padding:"4px 10px",justifySelf:"end"}}
    disabled=${busy} onClick=${()=>onToggle(row)}>
    ${row.active? T("admin.deactivate") : T("admin.activate")}
  </button>`;
}

function useFetch(path){
  const [d,setD]=useState(null); const [e,setE]=useState(null);
  const load=useCallback(()=>{ api(path).then(setD).catch(x=>setE(x.message)); },[path]);
  useEffect(()=>{ load(); },[load]);
  return [d,e,load];
}
