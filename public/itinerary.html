<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your Itinerary — MediVoyage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230e5750'/%3E%3Cpath d='M5 16h5l3 7 5-14 3 7h6' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=Azeret+Mono:wght@400;500&display=swap">
<style>
  /* Same "clinic ledger" system as widget.html — this is the other page a
     patient (not staff) opens, so it follows that family, not the panel's. */
  :root{
    --ground:#eaedef; --paper:#ffffff; --paper-2:#f4f6f8;
    --ink:#0c1316; --ink-2:#4b555b; --ink-3:#5f666b;
    --rule:#dde3e6; --rule-2:#c3ccd1;
    --accent:#0e5750; --accent-2:#126b60; /* darkened from #157a6f — 4.42:1 vs the wash background, needs 4.5:1; this passes at 5.42:1 */ --accent-wash:#e4efed; --accent-line:#9dc3bc;
    --brass:#8c6415;
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --ui:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"Azeret Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:3px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0e1315; --paper:#161c1f; --paper-2:#1b2225;
      --ink:#e6eaec; --ink-2:#9aa4a9; --ink-3:#818b91;
      --rule:#232b2e; --rule-2:#323c40;
      --accent:#5fb3a4; --accent-2:#7cc9ba; --accent-wash:#152825; --accent-line:#2c4b46;
      --brass:#d3a45c;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;padding:32px 20px 60px}
  [dir=rtl] .wrap{direction:rtl}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
  .mark{width:26px;height:26px;border-radius:2px;display:grid;place-items:center;flex:none;background:var(--accent);color:var(--paper)}
  .brand span{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.015em}
  h1{font-family:var(--display);font-weight:600;font-size:23px;margin:0 0 20px;letter-spacing:-.01em}
  .card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 0 rgba(12,19,22,.03)}
  .card.hero{background:var(--accent-wash);border-color:var(--accent-line);box-shadow:inset 3px 0 0 var(--accent)}
  [dir=rtl] .card.hero{box-shadow:inset -3px 0 0 var(--accent)}
  .cap{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
  .big{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.01em}
  .big.brass{color:var(--brass)}
  .meta{color:var(--ink-2);font-size:13px;margin-top:4px}
  .status{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--paper-2);border:1px solid var(--rule-2);color:var(--ink-2)}
  .status.done{background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent-2)}
  .empty{color:var(--ink-3);font-size:13px}
  .foot{margin-top:28px;color:var(--ink-3);font-size:12px;text-align:center}
</style>
</head>
<body>
  <div class="wrap" id="wrap"><div class="empty" style="text-align:center;padding:40px 0">Loading…</div></div>

<script>
  const LABELS = {
    en: { brand:"MediVoyage", title:"Your Itinerary", pickup:"Pickup", pickupEmpty:"Your coordinator hasn't set a pickup time yet.",
      hotel:"Hotel", next:"Next appointment", nextEmpty:"No upcoming appointment set yet.",
      status:{pending:"Pending",arranged:"Arranged",completed:"Completed",checked_in:"Checked in",checked_out:"Checked out",scheduled:"Scheduled",done:"Done"},
      foot:"This page updates automatically — bookmark it or come back to this link any time.", notFound:"This link isn't valid or has expired." },
    tr: { brand:"MediVoyage", title:"Programınız", pickup:"Alınış", pickupEmpty:"Koordinatörünüz henüz bir alınış saati belirlemedi.",
      hotel:"Otel", next:"Sıradaki randevu", nextEmpty:"Henüz planlanmış bir randevu yok.",
      status:{pending:"Bekliyor",arranged:"Ayarlandı",completed:"Tamamlandı",checked_in:"Giriş yapıldı",checked_out:"Çıkış yapıldı",scheduled:"Planlandı",done:"Tamamlandı"},
      foot:"Bu sayfa otomatik güncellenir — linki kaydedin, istediğiniz an tekrar açabilirsiniz.", notFound:"Bu link geçerli değil veya süresi doldu." },
    de: { brand:"MediVoyage", title:"Ihr Reiseplan", pickup:"Abholung", pickupEmpty:"Ihr Koordinator hat noch keine Abholzeit festgelegt.",
      hotel:"Hotel", next:"Nächster Termin", nextEmpty:"Noch kein Termin geplant.",
      status:{pending:"Ausstehend",arranged:"Geplant",completed:"Abgeschlossen",checked_in:"Eingecheckt",checked_out:"Ausgecheckt",scheduled:"Geplant",done:"Erledigt"},
      foot:"Diese Seite aktualisiert sich automatisch — speichern Sie den Link.", notFound:"Dieser Link ist ungültig oder abgelaufen." },
    ar: { brand:"MediVoyage", title:"برنامج رحلتك", pickup:"موعد الاستلام", pickupEmpty:"لم يحدد المنسق موعد الاستلام بعد.",
      hotel:"الفندق", next:"الموعد القادم", nextEmpty:"لا يوجد موعد قادم محدد بعد.",
      status:{pending:"قيد الانتظار",arranged:"تم الترتيب",completed:"مكتمل",checked_in:"تم تسجيل الدخول",checked_out:"تم تسجيل الخروج",scheduled:"مجدول",done:"تم"},
      foot:"يتم تحديث هذه الصفحة تلقائياً — احتفظ بالرابط.", notFound:"هذا الرابط غير صالح أو منتهي الصلاحية." },
    ru: { brand:"MediVoyage", title:"Ваш маршрут", pickup:"Встреча", pickupEmpty:"Координатор ещё не назначил время встречи.",
      hotel:"Отель", next:"Следующая встреча", nextEmpty:"Встреча пока не запланирована.",
      status:{pending:"Ожидание",arranged:"Организовано",completed:"Завершено",checked_in:"Заселение",checked_out:"Выселение",scheduled:"Запланировано",done:"Готово"},
      foot:"Эта страница обновляется автоматически — сохраните ссылку.", notFound:"Эта ссылка недействительна или истекла." },
    fr: { brand:"MediVoyage", title:"Votre programme", pickup:"Prise en charge", pickupEmpty:"Votre coordinateur n'a pas encore fixé d'heure.",
      hotel:"Hôtel", next:"Prochain rendez-vous", nextEmpty:"Aucun rendez-vous prévu pour le moment.",
      status:{pending:"En attente",arranged:"Organisé",completed:"Terminé",checked_in:"Enregistré",checked_out:"Départ effectué",scheduled:"Planifié",done:"Fait"},
      foot:"Cette page se met à jour automatiquement — enregistrez ce lien.", notFound:"Ce lien n'est pas valide ou a expiré." },
  };
  const RTL = new Set(["ar","he","fa","ur"]);
  const MARK = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 5 4-10 2 5h4"/></svg>`;

  function fmtWhen(iso){
    if(!iso) return null;
    const d = new Date(iso);
    return d.toLocaleString(undefined, { weekday:"short", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
  }
  function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function load(){
    const token = new URLSearchParams(location.search).get("token") || location.pathname.split("/").pop();
    const wrap = document.getElementById("wrap");
    let it;
    try{
      const res = await fetch("/api/public/itinerary/" + encodeURIComponent(token));
      if(!res.ok) throw new Error("not found");
      it = await res.json();
    }catch{
      const L = LABELS.en;
      wrap.innerHTML = `<div class="empty" style="text-align:center;padding:60px 0">${L.notFound}</div>`;
      return;
    }
    const lang = LABELS[it.language] ? it.language : "en";
    const L = LABELS[lang];
    if(RTL.has(lang)) document.documentElement.setAttribute("dir","rtl");
    document.title = L.title + " — MediVoyage";

    const pickupWhen = fmtWhen(it.pickup_at);
    const nextWhen = fmtWhen(it.next_appointment_at);

    wrap.innerHTML = `
      <div class="brand"><div class="mark">${MARK}</div><span>${L.brand}</span></div>
      <h1>${L.title}${it.name? `, ${escapeHtml(it.name.split(" ")[0])}`:''}</h1>

      <div class="card hero">
        <span class="cap">${L.pickup}</span>
        ${pickupWhen ? `<div class="big brass">${pickupWhen}</div>${it.pickup_location? `<div class="meta">${escapeHtml(it.pickup_location)}</div>`:''}`
          : `<div class="empty">${L.pickupEmpty}</div>`}
        <div style="margin-top:10px"><span class="status ${it.transfer_status==='completed'?'done':''}">${L.status[it.transfer_status]||escapeHtml(it.transfer_status)}</span></div>
      </div>

      <div class="card">
        <span class="cap">${L.hotel}</span>
        <span class="status ${it.hotel_status==='checked_in'?'done':''}">${L.status[it.hotel_status]||escapeHtml(it.hotel_status)}</span>
      </div>

      <div class="card">
        <span class="cap">${L.next}</span>
        ${nextWhen ? `<div class="big">${nextWhen}</div>${it.next_appointment_note? `<div class="meta">${escapeHtml(it.next_appointment_note)}</div>`:''}`
          : `<div class="empty">${L.nextEmpty}</div>`}
      </div>

      <div class="foot">${L.foot}</div>`;
  }
  load();
</script>
</body>
</html>
